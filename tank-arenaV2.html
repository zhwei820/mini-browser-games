<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>霓虹装甲：钢铁纪元</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(12, 18, 28, 0.82);
        --line: rgba(201, 222, 255, 0.18);
        --text: #eef6ff;
        --muted: #9fb0c8;
        --cyan: #38d9ff;
        --green: #4ade80;
        --gold: #ffd166;
        --red: #ff6178;
        --violet: #a78bfa;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #071015;
        color: var(--text);
        font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
        touch-action: none;
        user-select: none;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        background: #071015;
      }

      button {
        font: inherit;
        color: inherit;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(23, 34, 50, 0.94);
        cursor: pointer;
        transition:
          transform 120ms ease,
          background 120ms ease,
          border-color 120ms ease;
      }

      button:hover {
        background: rgba(37, 54, 77, 0.98);
        border-color: rgba(56, 217, 255, 0.58);
      }

      button:active {
        transform: scale(0.96);
      }

      .hud {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 18px 58px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(16px);
      }

      .brand {
        position: fixed;
        top: 18px;
        left: 18px;
        width: min(460px, calc(100vw - 36px));
        padding: 14px;
      }

      .brand h1 {
        margin: 0 0 10px;
        font-size: clamp(24px, 4vw, 38px);
        line-height: 1;
        letter-spacing: 0;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .stat {
        min-width: 0;
        padding: 9px;
        border: 1px solid rgba(201, 222, 255, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.045);
      }

      .label {
        color: var(--muted);
        font-size: 11px;
        line-height: 1;
      }

      .value {
        margin-top: 6px;
        font-size: 20px;
        font-weight: 850;
        line-height: 1;
      }

      .bars {
        margin-top: 10px;
        display: grid;
        gap: 7px;
      }

      .bar {
        height: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .bar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--green), var(--cyan));
      }

      .bar.shield span {
        background: linear-gradient(90deg, #2563eb, var(--cyan));
      }

      .bar.heat span {
        background: linear-gradient(90deg, var(--gold), var(--red));
      }

      .side {
        position: fixed;
        right: 18px;
        top: 18px;
        width: min(292px, calc(100vw - 36px));
        padding: 14px;
      }

      .side h2,
      .upgrade-panel h2 {
        margin: 0 0 10px;
        color: #dcecff;
        font-size: 13px;
        letter-spacing: 0;
      }

      .status-list {
        display: grid;
        gap: 8px;
        color: #d7e6f8;
        font-size: 13px;
      }

      .status-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(201, 222, 255, 0.1);
      }

      .status-row:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .status-row strong {
        color: #ffffff;
        font-weight: 850;
      }

      .controls {
        position: fixed;
        left: 18px;
        bottom: 18px;
        display: flex;
        gap: 8px;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        font-size: 19px;
      }

      .fire-btn,
      .skill-btn {
        position: fixed;
        right: 20px;
        bottom: 24px;
        width: 64px;
        height: 64px;
        display: none;
        place-items: center;
        font-size: 23px;
        pointer-events: auto;
      }

      .skill-btn {
        right: 96px;
        width: 54px;
        height: 54px;
        bottom: 30px;
        font-size: 20px;
      }

      .move-joystick {
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 4;
        width: 126px;
        height: 126px;
        display: none;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
      }

      .move-joystick-base {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(148, 232, 255, 0.3);
        background: rgba(4, 10, 18, 0.44);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.05),
          0 18px 42px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(12px);
      }

      .move-joystick-thumb {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(255, 214, 102, 0.8);
        background: radial-gradient(
          circle at 34% 30%,
          rgba(255, 255, 255, 0.72),
          rgba(255, 214, 102, 0.56) 34%,
          rgba(15, 25, 38, 0.82) 72%
        );
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.32);
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(3, 8, 14, 0.64);
      }

      .overlay.hidden {
        display: none;
      }

      .start-card,
      .upgrade-panel {
        width: min(760px, 96vw);
        max-height: 94vh;
        overflow: auto;
        padding: 18px;
      }

      .start-card h2,
      .result-title {
        margin: 0;
        font-size: clamp(30px, 6vw, 58px);
        line-height: 1;
        letter-spacing: 0;
      }

      .start-card p,
      .result-text {
        margin: 12px 0 0;
        color: #c8d5e7;
        font-size: 15px;
        line-height: 1.65;
      }

      .mode-grid {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(142px, 1fr));
        gap: 10px;
      }

      .mode-card {
        min-height: 132px;
        padding: 14px;
        text-align: left;
      }

      .mode-card.active {
        border-color: rgba(56, 217, 255, 0.78);
        background: rgba(40, 71, 92, 0.92);
      }

      .mode-card strong {
        display: block;
        margin-bottom: 8px;
        color: #ffffff;
        font-size: 17px;
      }

      .mode-card span {
        color: #b8c8dc;
        font-size: 13px;
        line-height: 1.5;
      }

      .garage-wrap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }
      .garage-block {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(8, 18, 24, 0.72);
      }
      .garage-block h3 {
        margin: 0 0 8px;
        color: #9fb2c8;
        font-size: 12px;
      }
      .garage-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
      .garage-card {
        min-height: 58px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: rgba(21, 43, 54, 0.88);
        color: #eaf6ff;
        text-align: left;
      }
      .garage-card.active {
        border-color: rgba(56, 217, 255, 0.78);
        background: rgba(56, 217, 255, 0.12);
      }
      .garage-card strong {
        display: block;
        font-size: 11px;
      }
      .garage-card span {
        display: block;
        margin-top: 3px;
        color: #9fb2c8;
        font-size: 9px;
        line-height: 1.3;
      }
      .armory-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .armory-card {
        min-height: 58px;
        padding: 7px;
      }
      .armory-card em {
        display: block;
        margin-top: 4px;
        color: #ffd166;
        font-size: 9px;
        font-style: normal;
      }
      .garage-meta {
        margin: 10px 0 0;
        color: #ffd166;
        font-size: 10px;
        font-weight: 900;
      }
      .career-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        margin-top: 8px;
      }
      .career-chip {
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.035);
        font-size: 9px;
        color: #9fb2c8;
      }
      .career-chip b {
        display: block;
        margin-bottom: 3px;
        color: #eaf6ff;
        font-size: 11px;
      }
      .career-chip.done {
        border-color: rgba(74, 222, 128, 0.55);
        color: #78e8a5;
      }
      .save-tools {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 9px;
      }
      .save-tools button {
        min-height: 34px;
        padding: 0 12px;
        font-size: 10px;
        font-weight: 900;
      }

      .primary {
        margin-top: 16px;
        min-height: 46px;
        padding: 0 18px;
        background: rgba(36, 137, 124, 0.96);
        border-color: rgba(74, 222, 128, 0.72);
        font-weight: 850;
      }

      .primary:hover {
        background: rgba(45, 158, 143, 0.98);
      }

      .upgrade-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .upgrade-card {
        min-height: 150px;
        padding: 14px;
        text-align: left;
      }

      .upgrade-card strong {
        display: block;
        color: #ffffff;
        font-size: 17px;
      }

      .upgrade-card span {
        display: block;
        margin-top: 8px;
        color: #b8c8dc;
        font-size: 13px;
        line-height: 1.5;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        z-index: 4;
        transform: translateX(-50%);
        min-width: min(520px, calc(100vw - 36px));
        padding: 12px 14px;
        text-align: center;
        color: #eaf6ff;
        font-weight: 800;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, -8px);
      }

      .stage-card {
        min-height: 0;
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent, var(--cyan));
        border-radius: 8px;
        background: rgba(23, 34, 50, 0.94);
      }

      .upgrade-grid.hidden {
        display: none;
      }

      .upgrade-card.picked {
        border-color: rgba(255, 209, 102, 0.85);
        background: rgba(255, 209, 102, 0.12);
      }

      .upgrade-card:disabled:not(.picked) {
        opacity: 0.4;
      }

      .shop-head {
        margin: 14px 0 8px;
        color: var(--gold);
        font-size: 13px;
        font-weight: 850;
      }

      .shop-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 8px;
      }

      .shop-card {
        min-height: 92px;
        padding: 9px;
        text-align: left;
      }

      .shop-card:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .shop-card small {
        color: var(--muted);
        font-size: 10px;
      }

      .shop-card strong {
        display: block;
        margin-top: 2px;
        color: #ffffff;
        font-size: 13px;
      }

      .shop-card strong b {
        color: var(--cyan);
        font-size: 11px;
      }

      .shop-card span {
        display: block;
        margin-top: 4px;
        color: #b8c8dc;
        font-size: 11px;
        line-height: 1.4;
      }

      .shop-card em {
        display: block;
        margin-top: 5px;
        color: var(--gold);
        font-size: 11px;
        font-style: normal;
        font-weight: 800;
      }

      #shopContinue {
        width: 100%;
      }

      @media (max-width: 860px) {
        .brand,
        .side {
          top: 10px;
          left: 10px;
          right: auto;
          width: calc(100vw - 20px);
          padding: 10px;
        }

        .brand h1 {
          font-size: 24px;
        }
        .stats {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
        .stat {
          padding: 7px;
        }
        .value {
          font-size: 16px;
        }
        .side {
          display: none;
        }
        .controls {
          left: auto;
          right: 12px;
          bottom: 100px;
          flex-direction: column;
        }
        .icon-btn {
          width: 38px;
          height: 38px;
          font-size: 17px;
        }
        .move-joystick {
          display: block;
          left: 12px;
          bottom: 12px;
          width: 112px;
          height: 112px;
        }
        .toast {
          bottom: 104px;
          min-width: min(340px, calc(100vw - 28px));
        }
        .fire-btn,
        .skill-btn {
          display: grid;
        }
        .mode-grid,
        .upgrade-grid,
        .garage-wrap {
          grid-template-columns: 1fr;
        }
        .career-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .mode-card,
        .upgrade-card {
          min-height: 0;
        }
      }

      @media (max-width: 520px) {
        .brand {
          width: calc(100vw - 20px);
        }
        .stats {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .bars {
          margin-top: 8px;
        }
        .start-card,
        .upgrade-panel {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas" aria-label="霓虹装甲战场"></canvas>

    <div class="move-joystick" id="moveJoystick" aria-label="移动摇杆">
      <div class="move-joystick-base"></div>
      <div class="move-joystick-thumb" id="moveJoystickThumb"></div>
    </div>

    <div class="hud">
      <section class="brand panel">
        <h1>霓虹装甲 <b>纵向闯关</b></h1>
        <div class="stats">
          <div class="stat">
            <div class="label">关卡</div>
            <div class="value" id="waveValue">1</div>
          </div>
          <div class="stat">
            <div class="label">得分</div>
            <div class="value" id="scoreValue">0</div>
          </div>
          <div class="stat">
            <div class="label">最高</div>
            <div class="value" id="bestValue">0</div>
          </div>
          <div class="stat">
            <div class="label">敌军</div>
            <div class="value" id="enemyValue">0</div>
          </div>
          <div class="stat">
            <div class="label">装甲</div>
            <div class="value" id="armorValue">100</div>
          </div>
        </div>
        <div class="bars">
          <div class="bar">
            <span id="healthBar" style="width: 100%"></span>
          </div>
          <div class="bar shield">
            <span id="shieldBar" style="width: 100%"></span>
          </div>
          <div class="bar heat">
            <span id="reloadBar" style="width: 100%"></span>
          </div>
        </div>
      </section>

      <section class="side panel">
        <h2>战术状态</h2>
        <div class="status-list">
          <div class="status-row">
            <span>炮弹</span><strong id="shellValue">标准弹</strong>
          </div>
          <div class="status-row">
            <span>反弹</span><strong id="bounceValue">1</strong>
          </div>
          <div class="status-row">
            <span>零件</span><strong id="partValue">0</strong>
          </div>
          <div class="status-row">
            <span>技能</span><strong id="skillValue">电磁脉冲</strong>
          </div>
          <div class="status-row">
            <span>目标</span><strong id="objectiveValue">清空敌军</strong>
          </div>
          <div class="status-row">
            <span>备用车体</span><strong id="lifeValue">1</strong>
          </div>
          <div class="status-row">
            <span>操作</span><strong>WASD / 鼠标 / B 改装</strong>
          </div>
        </div>
      </section>

      <div class="controls">
        <button class="icon-btn" id="pauseBtn" title="暂停">Ⅱ</button>
        <button class="icon-btn" id="restartBtn" title="重新开始">↻</button>
        <button class="icon-btn" id="shopBtn" title="改装 (B)">🔧</button>
      </div>

      <button class="skill-btn" id="skillBtn" title="技能">✦</button>
      <button class="fire-btn" id="fireBtn" title="开火">●</button>
    </div>

    <div class="toast panel" id="toast">第 1 波</div>

    <div class="overlay" id="overlay">
      <section class="start-card panel">
        <h2 id="overlayTitle">霓虹装甲：纵向闯关</h2>
        <p id="overlayText">
          从战区南端出发一路向北，突破随机生成的街区、峡谷与碉堡，在每关尽头的封锁闸门后击毁关底首领。共五关，击毁敌人收集零件，随时按 B 或 🔧 改装：主炮火力、复合装甲、能量护盾可无限叠加升级。
        </p>
        <div class="mode-grid" id="stageGrid"></div>
        <div class="garage-wrap">
          <section class="garage-block">
            <h3>底盘选择</h3>
            <div class="garage-grid" id="chassisGrid"></div>
          </section>
          <section class="garage-block">
            <h3>主炮选择</h3>
            <div class="garage-grid" id="cannonGrid"></div>
          </section>
          <section class="garage-block" style="grid-column: 1/-1">
            <h3>永久军械库</h3>
            <div class="armory-grid" id="armoryGrid"></div>
            <div class="garage-meta" id="garageMeta">军功 0</div>
          </section>
          <section class="garage-block" style="grid-column: 1/-1">
            <h3>战役档案与里程碑</h3>
            <div class="career-grid" id="careerGrid"></div>
            <div class="save-tools">
              <button id="exportSaveBtn" type="button">导出存档码</button>
              <button id="importSaveBtn" type="button">导入存档码</button>
            </div>
          </section>
        </div>
        <button class="primary" id="startBtn">启动战车</button>
      </section>
    </div>

    <div class="overlay hidden" id="upgradeOverlay">
      <section class="upgrade-panel panel">
        <h2 id="upgradeTitle">选择升级</h2>
        <div class="upgrade-grid" id="upgradeGrid"></div>
        <div class="shop-head" id="shopScrap">零件 0</div>
        <div class="shop-grid" id="shopGrid"></div>
        <button class="primary" id="shopContinue" type="button">返回战斗</button>
      </section>
    </div>

    <script>
      (function () {
        "use strict";

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const waveValue = document.getElementById("waveValue");
        const scoreValue = document.getElementById("scoreValue");
        const bestValue = document.getElementById("bestValue");
        const enemyValue = document.getElementById("enemyValue");
        const armorValue = document.getElementById("armorValue");
        const healthBar = document.getElementById("healthBar");
        const shieldBar = document.getElementById("shieldBar");
        const reloadBar = document.getElementById("reloadBar");
        const shellValue = document.getElementById("shellValue");
        const bounceValue = document.getElementById("bounceValue");
        const partValue = document.getElementById("partValue");
        const skillValue = document.getElementById("skillValue");
        const objectiveValue = document.getElementById("objectiveValue");
        const pauseBtn = document.getElementById("pauseBtn");
        const restartBtn = document.getElementById("restartBtn");
        const skillBtn = document.getElementById("skillBtn");
        const fireBtn = document.getElementById("fireBtn");
        const moveJoystick = document.getElementById("moveJoystick");
        const moveJoystickThumb = document.getElementById("moveJoystickThumb");
        const overlay = document.getElementById("overlay");
        const overlayTitle = document.getElementById("overlayTitle");
        const overlayText = document.getElementById("overlayText");
        const stageGrid = document.getElementById("stageGrid");
        const lifeValue = document.getElementById("lifeValue");
        const shopBtn = document.getElementById("shopBtn");
        const shopGrid = document.getElementById("shopGrid");
        const shopScrap = document.getElementById("shopScrap");
        const shopContinue = document.getElementById("shopContinue");
        const chassisGrid = document.getElementById("chassisGrid");
        const cannonGrid = document.getElementById("cannonGrid");
        const armoryGrid = document.getElementById("armoryGrid");
        const garageMeta = document.getElementById("garageMeta");
        const careerGrid = document.getElementById("careerGrid");
        const exportSaveBtn = document.getElementById("exportSaveBtn");
        const importSaveBtn = document.getElementById("importSaveBtn");
        const startBtn = document.getElementById("startBtn");
        const upgradeOverlay = document.getElementById("upgradeOverlay");
        const upgradeTitle = document.getElementById("upgradeTitle");
        const upgradeGrid = document.getElementById("upgradeGrid");
        const toast = document.getElementById("toast");

        const TILE = 78;
        const COLS = 22;
        const WORLD_W = COLS * TILE;
        const GATE_ROW = 14;
        const GATE_GAP = [9, 12];
        const SEGMENT_ROWS = 10;
        const PLAYER_SIZE = 42;
        const MODE_KEY = "vertical";
        let ROWS = 90;
        let WORLD_H = ROWS * TILE;
        const STAGES = [
          {

        function loadGarage() {
          const base = {
            version: 3,
            credits: 0,
            tech: {
              power: 0,
              armor: 0,
              salvage: 0,
              cooling: 0,
              mobility: 0,
              recovery: 0,
            },
            totalKills: 0,
            bosses: 0,
            wins: 0,
            records: {},
            milestones: {},
            mastery: { chassis: {}, cannon: {} },
            loadout: {
              chassis: "vanguard",
              cannon: "cannon",
            },
            best: Number(localStorage.getItem("tank_arena_best")) || 0,
          };
          try {
            const value = JSON.parse(
              localStorage.getItem(TANK_SAVE_KEY) || "null",
            );
            if (value && (value.version === 2 || value.version === 3)) {
              return {
                ...base,
                ...value,
                version: 3,
                tech: { ...base.tech, ...(value.tech || {}) },
                records: value.records || {},
                milestones: value.milestones || {},
                mastery: {
                  chassis: value.mastery?.chassis || {},
                  cannon: value.mastery?.cannon || {},
                },
                loadout: { ...base.loadout, ...(value.loadout || {}) },
                best: Math.max(base.best, value.best || 0),
              };
            }
          } catch (error) {}
          return base;
        }

        function saveGarage() {
          garageSave.version = 3;
          garageSave.loadout = {
            chassis: selectedChassis,
            cannon: selectedCannon,
          };
          localStorage.setItem(TANK_SAVE_KEY, JSON.stringify(garageSave));
          localStorage.setItem("tank_arena_best", String(garageSave.best || 0));
        }

        function saveHash(text) {
          let hash = 2166136261;
          for (let i = 0; i < text.length; i++) {
            hash ^= text.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
          }
          return (hash >>> 0).toString(36);
        }

        function encodeGarageSave() {
          const json = JSON.stringify({
            game: "neon-tank",
            version: 3,
            data: garageSave,
          });
          const bytes = new TextEncoder().encode(json);
          let binary = "";
          bytes.forEach((byte) => (binary += String.fromCharCode(byte)));
          const payload = btoa(binary);
          return `NTA3.${payload}.${saveHash(payload)}`;
        }

        function decodeGarageSave(code) {
          const [prefix, payload, checksum] = String(code || "")
            .trim()
            .split(".");
          if (prefix !== "NTA3" || !payload || saveHash(payload) !== checksum)
            throw new Error("存档码校验失败");
          const binary = atob(payload);
          const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
          const parsed = JSON.parse(new TextDecoder().decode(bytes));
          if (parsed.game !== "neon-tank" || !parsed.data)
            throw new Error("不是霓虹装甲存档");
          localStorage.setItem(TANK_SAVE_KEY, JSON.stringify(parsed.data));
          garageSave = loadGarage();
          selectedChassis = CHASSIS[garageSave.loadout.chassis]
            ? garageSave.loadout.chassis
            : "vanguard";
          selectedCannon = CANNONS[garageSave.loadout.cannon]
            ? garageSave.loadout.cannon
            : "cannon";
          saveGarage();
          renderGarage();
        }

        function settleMilestones() {
          let bonus = 0;
          for (const item of CAREER_MILESTONES) {
            if (!garageSave.milestones[item.id] && item.done(garageSave)) {
              garageSave.milestones[item.id] = true;
              garageSave.credits += item.reward;
              bonus += item.reward;
            }
          }
          return bonus;
        }

        function renderGarage() {
          chassisGrid.innerHTML = Object.entries(CHASSIS)
            .map(
              ([key, item]) =>
                `<button class="garage-card ${selectedChassis === key ? "active" : ""}" data-chassis="${key}"><strong>${item.name}</strong><span>${item.text}</span></button>`,

          cannonGrid.innerHTML = Object.entries(CANNONS)

            )
            .join("");
          armoryGrid.innerHTML = Object.entries(ARMORY)
            .map(([key, item]) => {
              const level = garageSave.tech[key] || 0;
              const cost = item.cost(level);
              const maxed = level >= item.max;
              return `<button class="garage-card armory-card" data-armory="${key}" ${maxed || garageSave.credits < cost ? "disabled" : ""}><strong>${item.name} Lv.${level}</strong><span>${item.text}</span><em>${maxed ? "已满级" : `军功 ${cost}`}</em></button>`;
            })
            .join("");
          garageMeta.textContent = `军功 ${garageSave.credits} · 总击毁 ${garageSave.totalKills || 0} · 首领 ${garageSave.bosses || 0}`;
          careerGrid.innerHTML = [
            ...CAREER_MILESTONES.map((item) => {

              return `<div class="career-chip ${done ? "done" : ""}"><b>${done ? "✓ " : ""}${item.name}</b>${item.text} · ${done ? "已领取" : `军功 ${item.reward}`}</div>`;
            }),
            `<div class="career-chip"><b>战役胜场</b>${garageSave.wins || 0} 胜</div>`,
            `<div class="career-chip"><b>最远关卡</b>${garageSave.records?.[MODE_KEY]?.stage || 0}/${STAGES.length}</div>`,
            `<div class="career-chip"><b>底盘熟练</b>${garageSave.mastery?.chassis?.[selectedChassis] || 0} 次部署</div>`,
            `<div class="career-chip"><b>主炮熟练</b>${garageSave.mastery?.cannon?.[selectedCannon] || 0} 次部署</div>`,
          ].join("");

        function buyArmory(key) {
          const item = ARMORY[key];
          const level = garageSave.tech[key] || 0;
          const cost = item.cost(level);
          if (level >= item.max || garageSave.credits < cost) return;
          garageSave.credits -= cost;
          garageSave.tech[key] = level + 1;
          saveGarage();
          renderGarage();
        }

        function resize() {
          dpr = Math.min(2, window.devicePixelRatio || 1);
          view.w = window.innerWidth;
          view.h = window.innerHeight;
          canvas.width = Math.floor(view.w * dpr);
          canvas.height = Math.floor(view.h * dpr);
          canvas.style.width = `${view.w}px`;
          canvas.style.height = `${view.h}px`;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          updatePointerWorld();
        }

        function rand(min, max) {
          return min + Math.random() * (max - min);
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function angleLerp(a, b, t) {
          let diff = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
          return a + diff * t;
        }

        function distSq(a, b) {
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          return dx * dx + dy * dy;
        }

        function distance(a, b) {
          return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function norm(dx, dy) {
          const length = Math.hypot(dx, dy) || 1;
          return { x: dx / length, y: dy / length };
        }

        function updatePointerWorld() {
          const zoom = getZoom();
          pointer.worldX = camera.x + (pointer.x - view.w / 2) / zoom;
          pointer.worldY = camera.y + (pointer.y - view.h / 2) / zoom;
        }

        function screenToWorld(x, y) {
          const zoom = getZoom();
          return {
            x: camera.x + (x - view.w / 2) / zoom,
            y: camera.y + (y - view.h / 2) / zoom,
          };
        }

        function getZoom() {
          return clamp(Math.min(view.w, view.h) / 850, 0.62, 1.08);
        }

        function stageConfig() {
          return STAGES[clamp((game.stage || 1) - 1, 0, STAGES.length - 1)];
        }

        function stageLevel() {
          return 1 + ((game.stage || 1) - 1) * 1.6;
        }

        function irand(min, max) {
          return Math.floor(rand(min, max + 1));
        }

        function showToast(text) {
          toast.textContent = text;
          toast.classList.add("show");

        function makePlayer() {

            turretTurn: 9,

          tank.speed *= chassis.speed;
          tank.reload *= chassis.reload * cannon.reload;
          tank.reload *= 1 - (garageSave.tech.cooling || 0) * 0.02;
          tank.skillCooldown *= 1 - (garageSave.tech.cooling || 0) * 0.02;
          tank.speed *= 1 + (garageSave.tech.mobility || 0) * 0.02;
          tank.damage *=
            cannon.damage * (1 + (garageSave.tech.power || 0) * 0.04);
          tank.bulletSpeed *= cannon.speed;
          tank.bounces = cannon.bounce;
          tank.pierce += cannon.pierce || 0;
          tank.scatter += cannon.scatter || 0;
          tank.blast = (cannon.blast || 0) * (chassis.blast || 1);
          tank.shellName = cannon.shell || "标准弹";
          tank.frontArmor = chassis.front || 0;
          tank.drones = chassis.drone || 0;
          tank.skillMines = chassis.mines || 0;
          tank.pickupMagnet *= chassis.magnet || 1;
          return tank;
        }

        const PLAYER_DAMAGE_TAKEN = 0.75;
        const PLAYER_HIT_GRACE = 0.3;
        const SHIELD_REGEN_DELAY = 2.5;
        const SHIELD_REGEN_RATE = 20;
        const HP_REGEN_DELAY = 4;
        const HP_REGEN_RATE = 4;

        function maxEnergyShield(tank) {
          return Math.round(tank.maxHp * 0.45 * (tank.shieldMult || 1));
        }

        function newGame() {
          game = {
            stage: 1,

        function loadStage() {
          const stage = stageConfig();

          particles = [];

        function cellX(col) {
          return col * TILE + TILE / 2;
        }

        function cellY(row) {
          return row * TILE + TILE / 2;
        }

        // Cell codes: 0 empty, 1 brick, 2 steel, 3 barrel, 4 turret slot.
        function generateStage() {
          const stage = stageConfig();
          ROWS = GATE_ROW + 2 + stage.segments * SEGMENT_ROWS + 6;
          WORLD_H = ROWS * TILE;
          let grid = null;
          for (let attempt = 0; attempt < 30 && !grid; attempt++) {
            const candidate = buildStageGrid(stage);
            if (stageReachable(candidate)) grid = candidate;
          }
          if (!grid) {
            grid = buildStageGrid(stage);
            for (let r = GATE_ROW + 1; r < ROWS; r++)
              for (let c = 0; c < COLS; c++) if (grid[r][c] === 2) grid[r][c] = 1;
          }
          walls = [];
          barrels = [];
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const cell = grid[r][c];
              if (cell === 1 || cell === 2)
                walls.push(
                  makeWall(
                    cellX(c),
                    cellY(r),
                    TILE,
                    TILE,
                    cell === 2 ? "steel" : "brick",
                  ),
                );
              else if (cell === 3)
                barrels.push({
                  x: cellX(c),
                  y: cellY(r),
                  r: 20,
                  hp: 24,
                  alive: true,
                });
            }
          }
          wallsDirty = true;
          game.gateY = GATE_ROW * TILE;
          populateStage(grid, stage);
        }

        function setCell(grid, r, c, value) {
          if (r >= 0 && r < ROWS && c >= 0 && c < COLS) grid[r][c] = value;
        }

        function buildStageGrid(stage) {
          const grid = Array.from({ length: ROWS }, () =>
            new Array(COLS).fill(0),
          );
          for (const [r, c] of [
            [5, 3],
            [6, 3],
            [10, 6],
            [10, 7],
          ]) {
            setCell(grid, r, c, 2);
            setCell(grid, r, COLS - 1 - c, 2);
          }
          for (let i = 0; i < 4; i++) {
            const r = irand(7, 12);
            const c = irand(2, 8);
            if (!grid[r][c]) {
              setCell(grid, r, c, 1);
              setCell(grid, r, COLS - 1 - c, 1);
            }
          }
          for (let c = 0; c < COLS; c++)
            grid[GATE_ROW][c] = c >= GATE_GAP[0] && c <= GATE_GAP[1] ? 0 : 2;

          const templates = [
            "barricade",
            "pillars",
            "maze",
            "canyon",
            "bunker",
            "field",
          ];
          let last = "";
          for (let s = 0; s < stage.segments; s++) {
            const top = GATE_ROW + 2 + s * SEGMENT_ROWS;
            let kind = templates[irand(0, templates.length - 1)];
            if (kind === last)
              kind = templates[(templates.indexOf(kind) + 1) % templates.length];
            last = kind;
            buildSegment(grid, kind, top);
          }
          const barrelCount = Math.round(stage.segments * 1.6 * stage.barrels);
          for (let i = 0; i < barrelCount; i++) {
            const r = irand(GATE_ROW + 2, ROWS - 8);
            const c = irand(1, COLS - 2);
            if (!grid[r][c]) grid[r][c] = 3;
          }
          return grid;
        }

        function buildSegment(grid, kind, top) {
          const scatterBricks = (count) => {
            for (let i = 0; i < count; i++)
              setCell(grid, top + irand(0, 9), irand(1, COLS - 2), 1);
          };
          if (kind === "barricade") {
            const row = top + irand(3, 6);
            const gaps = [];
            for (let g = irand(1, 2); g > 0; g--) gaps.push(irand(2, COLS - 5));
            for (let c = 0; c < COLS; c++) {
              if (gaps.some((g) => c >= g && c < g + 3)) continue;
              setCell(grid, row, c, Math.random() < 0.45 ? 1 : 2);
            }
            scatterBricks(6);
          } else if (kind === "pillars") {
            for (let i = irand(4, 6); i > 0; i--) {
              const r = top + irand(0, 8);
              const c = irand(1, COLS - 3);
              setCell(grid, r, c, 2);
              setCell(grid, r + 1, c, 2);
              setCell(grid, r, c + 1, 2);
              setCell(grid, r + 1, c + 1, 2);
            }
            scatterBricks(5);
          } else if (kind === "maze") {
            for (let i = irand(5, 7); i > 0; i--) {
              const w = irand(2, 4);
              const h = irand(1, 3);
              const r0 = top + irand(0, 9 - h);
              const c0 = irand(1, COLS - 1 - w);
              for (let r = r0; r < r0 + h; r++)
                for (let c = c0; c < c0 + w; c++) setCell(grid, r, c, 1);
            }
          } else if (kind === "canyon") {
            const left = irand(3, 6);
            const right = irand(3, 6);
            for (let r = top + 1; r <= top + 8; r++) {
              const wobble = r % 3 === 0 ? 1 : 0;
              for (let c = 0; c < left - wobble; c++) setCell(grid, r, c, 2);
              for (let c = COLS - right + wobble; c < COLS; c++)
                setCell(grid, r, c, 2);
            }
            for (let i = 0; i < 4; i++)
              setCell(
                grid,
                top + irand(2, 7),
                irand(left + 1, COLS - right - 2),
                1,
              );
          } else if (kind === "bunker") {
            const c0 = irand(3, COLS - 10);
            const r0 = top + irand(1, 3);
            const w = 7;
            const h = 5;
            for (let c = c0; c < c0 + w; c++) setCell(grid, r0, c, 1);
            for (let r = r0; r < r0 + h; r++) {
              setCell(grid, r, c0, 1);
              setCell(grid, r, c0 + w - 1, 1);
            }
            scatterBricks(4);
            setCell(grid, r0 + 2, c0 + 3, 4);
          } else {
            scatterBricks(10);
            for (let i = 0; i < 3; i++) {
              const r = top + irand(0, 9);
              const c = irand(1, COLS - 2);
              if (!grid[r][c]) grid[r][c] = 3;
            }
          }
        }

        // Bricks and barrels can be destroyed, so only steel blocks the route.
        function stageReachable(grid) {
          const seen = Array.from({ length: ROWS }, () =>
            new Array(COLS).fill(false),
          );
          const queue = [[ROWS - 3, Math.floor(COLS / 2)]];
          seen[ROWS - 3][Math.floor(COLS / 2)] = true;
          while (queue.length) {
            const [r, c] = queue.shift();
            if (r === GATE_ROW) return true;
            for (const [dr, dc] of [
              [1, 0],
              [-1, 0],
              [0, 1],
              [0, -1],
            ]) {
              const nr = r + dr;
              const nc = c + dc;
              if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
              if (seen[nr][nc] || grid[nr][nc] === 2) continue;
              seen[nr][nc] = true;
              queue.push([nr, nc]);
            }
          }
          return false;
        }

        function neighborsClear(grid, r, c) {
          for (let dr = -1; dr <= 1; dr++)
            for (let dc = -1; dc <= 1; dc++) {
              const cell = grid[r + dr]?.[c + dc];
              if (cell === 1 || cell === 2 || cell === 3) return false;
            }
          return true;
        }

        function populateStage(grid, stage) {
          const level = stageLevel();
          for (let s = 0; s < stage.segments; s++) {
            const top = GATE_ROW + 2 + s * SEGMENT_ROWS;
            const squad = s + 1;
            const count =
              stage.squad +
              irand(0, 1) +
              (s >= stage.segments - 2 ? 1 : 0);
            const free = [];
            // Keep the spawn pad out of the wake radius so the run never opens under fire.
            for (let r = top; r < Math.min(top + SEGMENT_ROWS, ROWS - 12); r++) {
              for (let c = 1; c < COLS - 1; c++) {
                if (grid[r][c] === 4) {
                  spawnEnemy("turret", cellX(c), cellY(r), level).squad = squad;
                  grid[r][c] = 0;
                } else if (grid[r][c] === 0 && neighborsClear(grid, r, c)) {
                  free.push([r, c]);
                }
              }
            }
            for (let i = 0; i < count && free.length; i++) {
              const [r, c] = free.splice(irand(0, free.length - 1), 1)[0];
              const type = stage.pool[irand(0, stage.pool.length - 1)];
              spawnEnemy(type, cellX(c), cellY(r), level).squad = squad;
            }
          }
          const spec = stage.boss;
          const boss = spawnEnemy("boss", WORLD_W / 2, cellY(4), level);
          Object.assign(boss, {
            name: spec.name,
            hp: spec.hp,
            maxHp: spec.hp,
            size: spec.size,
            color: spec.color,
            damage: 20 + game.stage * 4,
            reload: Math.max(0.6, 1 - game.stage * 0.06),
            speed: 54 + game.stage * 4,
            score: 1200 + game.stage * 600,
            bodyAngle: Math.PI / 2,
            turretAngle: Math.PI / 2,
            spec,
            specialTimer: 2.5,
            specialIndex: 0,
          });
          game.boss = boss;
        }

        function makeWall(x, y, w, h, type) {
          return {
            x,
            y,
            w: w - 10,
            h: h - 10,
            type,
            hp: type === "steel" ? 9999 : 52,
            maxHp: type === "steel" ? 9999 : 52,
          };
        }

        function spawnEnemy(type, x, y, level) {
          const spec = ENEMY_TYPES[type];
          const elite =
            type !== "boss" &&
            Math.random() < Math.min(0.3, 0.035 * level * stageConfig().elite);
          const hpScale = (1 + level * 0.12) * (elite ? 1.55 : 1);
          const enemy = {
            id: Math.random(),
            type,
            name: elite ? `精英${spec.name}` : spec.name,
            x,
            y,
            vx: 0,
            vy: 0,
            bodyAngle: spec.turret ? Math.PI / 2 : rand(0, Math.PI * 2),
            turretAngle: Math.PI / 2 + rand(-0.6, 0.6),
            size: spec.size * (elite ? 1.1 : 1),
            hp: spec.hp * hpScale,
            maxHp: spec.hp * hpScale,
            speed: spec.speed * (elite ? 1.08 : 1),
            reload: spec.reload * (elite ? 0.82 : 1),
            reloadLeft: rand(0.2, 1.4),
            damage: spec.damage * (elite ? 1.22 : 1),
            score: spec.score * (elite ? 1.6 : 1),
            color: elite ? "#ffffff" : spec.color,
            aiTime: rand(0, 2),
            strafe: Math.random() < 0.5 ? 1 : -1,
            frontArmor: spec.frontArmor || 0,
            artillery: Boolean(spec.artillery),
            repair: Boolean(spec.repair),
            turret: Boolean(spec.turret),
            repairTimer: rand(2, 4),
            phaseTwo: false,
            dormant: true,
            squad: 0,
            elite,
          };
          enemies.push(enemy);
          return enemy;
        }

        function spawnNear(type, cx, cy, radius) {
          for (let i = 0; i < 40; i++) {
            const a = rand(0, Math.PI * 2);
            const d = rand(radius * 0.5, radius * 1.4);
            const x = cx + Math.cos(a) * d;
            const y = cy + Math.sin(a) * d;
            if (x < 60 || x > WORLD_W - 60 || y < 60 || y > WORLD_H - 60)
              continue;
            if (game.bossActive && y > game.gateY - 50) continue;
            if (circleHitsWall(x, y, 30)) continue;
            const enemy = spawnEnemy(type, x, y, stageLevel());
            enemy.dormant = false;
            return enemy;
          }
          return null;
        }

        let wallRows = [];
        let wallsDirty = true;

        function rowWalls(row) {
          if (wallsDirty) {
            wallRows = [];
            for (const wall of walls) {
              const r = Math.floor(wall.y / TILE);
              (wallRows[r] || (wallRows[r] = [])).push(wall);
            }
            wallsDirty = false;
          }
          return wallRows[row];
        }

        function wallAt(x, y, r) {
          const r0 = Math.floor((y - r) / TILE) - 1;
          const r1 = Math.floor((y + r) / TILE) + 1;
          for (let row = r0; row <= r1; row++) {
            const list = rowWalls(row);
            if (!list) continue;
            for (const wall of list) if (circleRectHit(x, y, r, wall)) return wall;
          }
          return null;
        }

        function circleHitsWall(x, y, r) {
          return Boolean(wallAt(x, y, r));
        }

        function circleRectHit(cx, cy, r, rect) {
          const closestX = clamp(cx, rect.x - rect.w / 2, rect.x + rect.w / 2);
          const closestY = clamp(cy, rect.y - rect.h / 2, rect.y + rect.h / 2);
          const dx = cx - closestX;
          const dy = cy - closestY;
          return dx * dx + dy * dy <= r * r;
        }

        function moveCircle(entity, dx, dy, radius) {
          let nx = clamp(entity.x + dx, radius, WORLD_W - radius);
          let ny = entity.y;
          if (!circleHitsWall(nx, ny, radius)) {
            entity.x = nx;
          } else {
            entity.vx *= -0.12;
          }
          nx = entity.x;
          ny = clamp(entity.y + dy, radius, WORLD_H - radius);
          if (!circleHitsWall(nx, ny, radius)) {
            entity.y = ny;
          } else {
            entity.vy *= -0.12;
          }
        }

        function fireBullet(owner, x, y, angle, options) {
          const speed = options.speed || player.bulletSpeed;
          const size = options.size || 6;
          bullets.push({
            owner,
            x,
            y,
            px: x,
            py: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            angle,
            r: size,
            damage: options.damage,
            bounces: options.bounces,
            pierce: options.pierce || 0,
            life: options.life || 2.7,
            color: options.color || "#38d9ff",
            blast: options.blast || 0,
            ownerTank: options.ownerTank || null,
          });
        }

        function playerShoot() {
          if (game.state !== "playing" || player.reloadLeft > 0) return;
          const muzzle = player.size * 0.72;
          fireBullet(
            "player",
            player.x + Math.cos(player.turretAngle) * muzzle,
            player.y + Math.sin(player.turretAngle) * muzzle,
            player.turretAngle,
            {
              damage: player.damage,
              bounces: player.bounces,
              pierce: player.pierce,
              speed: player.bulletSpeed,
              color: player.scatter ? "#ffd166" : "#38d9ff",
              size: 6,
              blast: player.blast,
              ownerTank: player,
            },
          );
          for (let i = 0; i < player.scatter; i++) {
            const spread = 0.16 + i * 0.04;
            fireBullet(
              "player",
              player.x,
              player.y,
              player.turretAngle - spread,
              {
                damage: player.damage * 0.48,
                bounces: Math.max(0, player.bounces - 1),
                speed: player.bulletSpeed * 0.92,
                color: "#ffd166",
                size: 4.8,
                life: 1.7,
                ownerTank: player,
              },
            );
            fireBullet(
              "player",
              player.x,
              player.y,
              player.turretAngle + spread,
              {
                damage: player.damage * 0.48,
                bounces: Math.max(0, player.bounces - 1),
                speed: player.bulletSpeed * 0.92,
                color: "#ffd166",
                size: 4.8,
                life: 1.7,
                ownerTank: player,
              },
            );
          }
          player.reloadLeft = player.reload;
          shake(3);
        }

        function useSkill() {
          if (game.state !== "playing" || player.skillLeft > 0) return;
          player.skillLeft = player.skillCooldown;
          player.shieldUntil =
            performance.now() / 1000 + 1.15 + player.shieldBonus;
          if (player.chassis === "interceptor") {
            player.overdriveUntil = performance.now() / 1000 + 4.5;
            player.reloadLeft = 0;
            showToast("截击超频启动");
          } else if (player.chassis === "bastion") {
            player.shieldUntil += 2.4;
            healPlayer(18);
            showToast("堡垒壁垒展开");
          } else if (player.chassis === "engineer") {
            healPlayer(24);
            player.skillMines = Math.max(6, player.skillMines);
            showToast("工程支援释放");
          } else if (player.chassis === "specter") {
            player.shieldUntil += 1.8;
            const dx = Math.cos(player.bodyAngle) * 150;
            const dy = Math.sin(player.bodyAngle) * 150;
            moveCircle(player, dx, dy, player.size * 0.45);
            player.reloadLeft = 0;
            showToast("幻影相位突进");
          } else if (player.chassis === "juggernaut") {
            player.shieldUntil += 1.1;
            healPlayer(12);
            explosions.push({
              x: player.x,
              y: player.y,
              r: 28,
              max: 520,
              life: 0.5,
              damage: 86,
              owner: "player",
              color: "#ffd166",
              ownerTank: player,
            });
            showToast("破城震荡释放");
          }
          explosions.push({
            x: player.x,
            y: player.y,
            r: 24,
            max: 360,
            life: 0.42,
            damage: 42,
            owner: "player",
            color: "#38d9ff",
            ownerTank: player,
          });
          for (const enemy of enemies) {
            const d = distance(player, enemy);
            if (d < 360) {
              enemy.reloadLeft += 1.2;
              damageEnemy(enemy, 34 * (1 - d / 480), "front", player);
              addFloater("EMP", enemy.x, enemy.y - 18, "#38d9ff");
            }
          }
          for (let i = 0; i < player.skillMines; i++) {
            const a = (Math.PI * 2 * i) / player.skillMines;
            mines.push({
              owner: "player",
              x: player.x + Math.cos(a) * 92,
              y: player.y + Math.sin(a) * 92,
              r: 12,
              arm: 0.55,
              life: 9,
              ownerTank: player,
            });
          }
          burst(player.x, player.y, "#38d9ff", 34);
          if (player.chassis === "vanguard") showToast("电磁脉冲已释放");
        }

        function update(dt, now) {
          if (game.state !== "playing") {
            updateEffects(dt);
            return;
          }
          player.reloadLeft = Math.max(0, player.reloadLeft - dt);
          player.skillLeft = Math.max(0, player.skillLeft - dt);
          updatePlayer(dt);
          updateDrones(dt);
          updateEnemies(dt);
          updateParts(dt);
          updateBattleEvents(dt);
          updateBullets(dt);
          updateMines(dt);
          updateExplosions(dt);
          updateEffects(dt);
          updateCamera(dt);
          checkStage(dt);
          hudTimer -= dt;
          if (hudTimer <= 0) {
            updateHud(false);
            hudTimer = 0.08;
          }
          if (toastTimer > 0) {
            toastTimer -= dt;
            if (toastTimer <= 0) toast.classList.remove("show");
          }
          if (player.hp <= 0 && game.state === "playing") {
            if (player.lives > 0) revivePlayer();
            else endGame(false);
          }
        }

        function revivePlayer() {
          player.lives -= 1;
          player.hp = player.maxHp;
          player.energyShield = maxEnergyShield(player);
          player.shieldUntil = performance.now() / 1000 + 3;
          bullets = bullets.filter((bullet) => bullet.owner === "player");
          explosions.push({
            x: player.x,
            y: player.y,
            r: 24,
            max: 300,
            life: 0.45,
            damage: 60,
            owner: "player",
            color: "#38d9ff",
            ownerTank: player,
          });
          burst(player.x, player.y, "#38d9ff", 46);
          shake(12);
          showToast(`备用车体启动，剩余 ${player.lives}`);
        }

        function updatePlayer(dt) {
          let ax = 0;
          let ay = 0;
          if (keys.has("KeyW") || keys.has("ArrowUp")) ay -= 1;
          if (keys.has("KeyS") || keys.has("ArrowDown")) ay += 1;
          if (keys.has("KeyA") || keys.has("ArrowLeft")) ax -= 1;
          if (keys.has("KeyD") || keys.has("ArrowRight")) ax += 1;
          if (touchMove.active) {
            ax += touchMove.dx;
            ay += touchMove.dy;
          }
          const input = norm(ax, ay);
          const moving = Math.hypot(ax, ay) > 0.04;
          const overdrive =
            (player.overdriveUntil || 0) > performance.now() / 1000 ? 1.55 : 1;
          const targetSpeed = moving ? player.speed * overdrive : 0;
          player.vx = lerp(
            player.vx,
            input.x * targetSpeed,
            1 - Math.pow(0.001, dt),
          );
          player.vy = lerp(
            player.vy,
            input.y * targetSpeed,
            1 - Math.pow(0.001, dt),
          );
          if (moving)
            player.bodyAngle = angleLerp(
              player.bodyAngle,
              Math.atan2(input.y, input.x),
              dt * 9,
            );
          updatePointerWorld();
          const turretTarget = Math.atan2(
            pointer.worldY - player.y,
            pointer.worldX - player.x,
          );
          player.turretAngle = angleLerp(
            player.turretAngle,
            turretTarget,
            dt * player.turretTurn,
          );
          moveCircle(
            player,
            player.vx * dt,
            player.vy * dt,
            player.size * 0.48,
          );
          if (pointer.down) playerShoot();
          if (player.hp > 0) {
            const sinceHit = performance.now() / 1000 - player.lastHitAt;
            if (sinceHit > SHIELD_REGEN_DELAY)
              player.energyShield = Math.min(
                maxEnergyShield(player),
                player.energyShield + player.shieldRegen * dt,
              );
            if (sinceHit > HP_REGEN_DELAY)
              healPlayer((HP_REGEN_RATE + player.regen) * dt);
          }
        }

        function updateDrones(dt) {
          while (drones.length < player.drones) {
            drones.push({
              angle: rand(0, Math.PI * 2),
              reload: rand(0, 0.5),
              x: player.x,
              y: player.y,
            });
          }
          for (let i = 0; i < drones.length; i++) {
            const drone = drones[i];
            drone.angle += dt * (1.6 + i * 0.18);
            drone.x = player.x + Math.cos(drone.angle) * 82;
            drone.y = player.y + Math.sin(drone.angle) * 82;
            drone.reload -= dt;
            if (drone.reload > 0) continue;
            let target = null;
            let best = Infinity;
            for (const enemy of enemies) {
              if (enemy.dormant) continue;
              const score = enemy.hp + distance(drone, enemy) * 0.18;
              if (score < best) {
                best = score;
                target = enemy;
              }
            }
            if (target && distance(drone, target) < 760) {
              const angle = Math.atan2(target.y - drone.y, target.x - drone.x);
              fireBullet("player", drone.x, drone.y, angle, {
                damage: player.damage * 0.36,
                bounces: 0,
                speed: player.bulletSpeed * 1.12,
                color: "#4ade80",
                size: 4,
                life: 1.2,
                ownerTank: player,
              });
              drone.reload = 0.62;
            }
          }
        }

        function updateParts(dt) {
          for (let i = parts.length - 1; i >= 0; i--) {
            const part = parts[i];
            part.life -= dt;
            part.spin += dt * 3;
            const playerDistance = distance(player, part);
            if (player.hp > 0 && playerDistance < player.pickupMagnet) {
              const pull =
                clamp(1 - playerDistance / player.pickupMagnet, 0.08, 1) *
                520 *
                dt;
              const n = norm(player.x - part.x, player.y - part.y);
              part.x += n.x * pull;
              part.y += n.y * pull;
            }
            if (distance(player, part) < 42 && player.hp > 0) {
              collectPickup(part);
              parts.splice(i, 1);
              continue;
            }
            if (part.life <= 0) parts.splice(i, 1);
          }
        }

        function callAirstrike(x, y, r, owner) {
          airstrikes.push({
            x,
            y,
            r,
            owner: owner || "neutral",
            warning: 1.7,
            life: 2.2,
            exploded: false,
          });
        }

        function updateBattleEvents(dt) {
          const stage = stageConfig();
          if (!game.bossDefeated) {
            game.eventTimer -= dt;
            if (game.eventTimer <= 0) {
              game.eventCount += 1;
              const minY = game.bossActive ? 80 : game.gateY + TILE * 1.5;
              const maxY = game.bossActive ? game.gateY - 60 : WORLD_H - 100;
              if (game.eventCount % 2 === 0 || stage.storm) {
                for (let i = 0; i < (stage.storm ? 4 : 3); i++)
                  callAirstrike(
                    clamp(player.x + rand(-520, 520), 100, WORLD_W - 100),
                    clamp(player.y + rand(-420, 300), minY, maxY),
                    rand(72, 118),
                  );
                showToast("空袭坐标已标记");
              } else {
                for (let i = 0; i < 4; i++)
                  parts.push(
                    makePickup(
                      clamp(player.x + rand(-240, 240), 80, WORLD_W - 80),
                      clamp(player.y + rand(-190, 190), minY, maxY),
                      i === 0 ? "module" : i === 1 ? "repair" : "scrap",
                      2 + game.stage,
                    ),
                  );
                showToast("战术补给已投放");
              }
              game.eventTimer = stage.storm ? rand(16, 22) : rand(26, 36);
            }
          }
          for (const strike of airstrikes) {
            strike.warning -= dt;
            strike.life -= dt;
            if (strike.warning <= 0 && !strike.exploded) {
              strike.exploded = true;
              explosions.push({
                x: strike.x,
                y: strike.y,
                r: 20,
                max: strike.r * 1.45,
                life: 0.38,
                damage: 78,
                owner: strike.owner,
                color: "#ff8b5f",
              });
              burst(strike.x, strike.y, "#ff8b5f", 34);
            }
          }
          airstrikes = airstrikes.filter((strike) => strike.life > 0);
        }

        function dropLoot(enemy) {
          const drop = (kind, value) => {
            const a = rand(0, Math.PI * 2);
            const r = rand(10, 52);
            parts.push(
              makePickup(
                enemy.x + Math.cos(a) * r,
                enemy.y + Math.sin(a) * r,
                kind,
                value,
              ),
            );
          };
          if (enemy === game.boss) {
            drop("repair");
            drop("shield");
            drop("module");
            drop("module");
            return;
          }
          let value = Math.round(
            (Math.max(1, Math.round(enemy.score / 90)) + (enemy.elite ? 2 : 0)) *
              (1 + (game.stage - 1) * 0.25),
          );
          for (let coins = Math.min(3, value); coins > 0; coins--) {
            const share = Math.ceil(value / coins);
            value -= share;
            drop("scrap", share);
          }
          const roll = Math.random();
          if (roll < 0.1) drop("repair");
          else if (roll < 0.16) drop("shield");
          else if (roll < (enemy.elite ? 0.5 : 0.22)) drop("module");
        }

        function makePickup(x, y, forcedKind, value) {
          const roll = Math.random();
          const kind =
            forcedKind ||
            (roll < 0.58 ? "module" : roll < 0.8 ? "repair" : "shield");
          return {
            x,
            y,
            kind,
            value: value || 1,
            module: kind === "module" ? randomPart() : null,
            life: kind === "scrap" ? 40 : 22,
            spin: rand(0, Math.PI * 2),
            color:
              kind === "repair"
                ? "#4ade80"
                : kind === "shield"
                  ? "#38d9ff"
                  : kind === "module"
                    ? "#c084fc"
                    : "#ffd166",
          };
        }

        function randomPart() {
          return PARTS[Math.floor(Math.random() * PARTS.length)];
        }

        function collectPickup(pickup) {
          if (pickup.kind === "scrap") {
            player.scrap += pickup.value;
            addFloater(`+${pickup.value} 零件`, player.x, player.y - 36, "#ffd166");
            return;
          }
          if (pickup.kind === "repair") {
            healPlayer(42);
            addFloater("修复 +42", player.x, player.y - 36, "#4ade80");
            showToast("装甲修复");
            return;
          }
          if (pickup.kind === "shield") {
            player.shieldUntil = performance.now() / 1000 + 2.4;
            player.energyShield = maxEnergyShield(player);
            addFloater("护盾", player.x, player.y - 36, "#38d9ff");
            showToast("临时护盾启动");
            return;
          }
          const module = pickup.module || randomPart();
          module.apply(player);
          player.parts.push(module.title);
          addFloater(module.title, player.x, player.y - 40, "#c084fc");
          showToast(`自动装配：${module.title}`);
        }

        function wakeSquad(enemy) {
          if (!enemy.dormant || enemy === game.boss) return;
          for (const other of enemies) {
            if (
              other.dormant &&
              other !== game.boss &&
              (other === enemy || (enemy.squad && other.squad === enemy.squad))
            ) {
              other.dormant = false;
              other.reloadLeft = Math.max(other.reloadLeft, rand(0.4, 1.2));
            }
          }
        }

        function updateEnemies(dt) {
          for (const enemy of enemies) {
            if (enemy.dormant) {
              if (distSq(enemy, player) < 640 * 640) wakeSquad(enemy);
              continue;
            }
            enemy.aiTime -= dt;
            if (enemy.repair) {
              enemy.repairTimer -= dt;
              if (enemy.repairTimer <= 0) {
                enemy.repairTimer = 4.2;
                for (const ally of enemies) {
                  if (ally !== enemy && distance(enemy, ally) < 260)
                    ally.hp = Math.min(
                      ally.maxHp,
                      ally.hp + 24 + stageLevel() * 3,
                    );
                }
                explosions.push({
                  x: enemy.x,
                  y: enemy.y,
                  r: 20,
                  max: 180,
                  life: 0.34,
                  damage: 0,
                  owner: "enemy",
                  color: "#70e0a0",
                  visualOnly: true,
                });
              }
            }
            if (enemy === game.boss) updateBossPattern(enemy, dt);
            const target = player;
            const blocked = !hasLineOfSight(enemy, target);
            if (
              blocked &&
              !enemy.turret &&
              (!enemy.waypoint || enemy.aiTime <= 0)
            )
              enemy.waypoint = findFlankPoint(enemy, target);
            const goal = blocked && enemy.waypoint ? enemy.waypoint : target;
            const dx = goal.x - enemy.x;
            const dy = goal.y - enemy.y;
            const d = Math.hypot(dx, dy) || 1;
            const toGoal = { x: dx / d, y: dy / d };
            const ideal = enemy.artillery
              ? 720
              : enemy.type === "rocket"
                ? 620
                : enemy.type === "heavy" || enemy.type === "shield"
                  ? 360
                  : enemy.type === "boss"
                    ? 420
                    : 430;
            const close = d < ideal * 0.72;
            const far = d > ideal * 1.18;
            let mx = 0;
            let my = 0;
            if (far) {
              mx += toGoal.x;
              my += toGoal.y;
            } else if (close) {
              mx -= toGoal.x;
              my -= toGoal.y;
            }
            mx += -toGoal.y * enemy.strafe * 0.55;
            my += toGoal.x * enemy.strafe * 0.55;
            const dodge = dodgeVector(enemy);
            mx += dodge.x;
            my += dodge.y;
            if (enemy.aiTime <= 0) {
              enemy.strafe *= Math.random() < 0.62 ? -1 : 1;
              enemy.aiTime = rand(0.8, 1.9);
            }
            const move = norm(mx, my);
            const speed =
              enemy.speed * (enemy.hp < enemy.maxHp * 0.35 ? 1.1 : 1);
            enemy.vx = lerp(enemy.vx, move.x * speed, 1 - Math.pow(0.005, dt));
            enemy.vy = lerp(enemy.vy, move.y * speed, 1 - Math.pow(0.005, dt));
            if (Math.hypot(enemy.vx, enemy.vy) > 12)
              enemy.bodyAngle = angleLerp(
                enemy.bodyAngle,
                Math.atan2(enemy.vy, enemy.vx),
                dt * 5,
              );
            const aimDx = target.x - enemy.x;
            const aimDy = target.y - enemy.y;
            enemy.turretAngle = angleLerp(
              enemy.turretAngle,
              Math.atan2(aimDy, aimDx),
              dt *
                (enemy.type === "heavy" || enemy.type === "shield" ? 3.4 : 5.2),
            );
            moveCircle(enemy, enemy.vx * dt, enemy.vy * dt, enemy.size * 0.48);
            enemy.reloadLeft -= dt;
            if (
              enemy.type === "miner" &&
              enemy.reloadLeft < enemy.reload * 0.28 &&
              Math.random() < dt * 0.65
            ) {
              mines.push({
                owner: "enemy",
                x: enemy.x - toGoal.x * 42,
                y: enemy.y - toGoal.y * 42,
                r: 11,
                arm: 0.7,
                life: 8,
                ownerTank: enemy,
              });
            }
            const targetDistance = distance(enemy, target);
            const aimError = Math.abs(
              Math.atan2(
                Math.sin(enemy.turretAngle - Math.atan2(aimDy, aimDx)),
                Math.cos(enemy.turretAngle - Math.atan2(aimDy, aimDx)),
              ),
            );
            if (
              enemy.reloadLeft <= 0 &&
              targetDistance < 880 &&
              aimError < 0.34 &&
              !blocked
            ) {
              enemyFire(enemy, target);
              enemy.reloadLeft = enemy.reload * rand(0.78, 1.25);
            }
          }
        }

        function updateBossPattern(boss, dt) {
          if (boss.hp < boss.maxHp * 0.5 && !boss.phaseTwo) {
            boss.phaseTwo = true;
            boss.reload *= 0.72;
            boss.speed *= 1.18;
            spawnNear("shield", boss.x, boss.y, 220);
            spawnNear(
              game.stage >= 3 ? "artillery" : "heavy",
              boss.x,
              boss.y,
              220,
            );
            showToast(`${boss.name} 进入狂暴阶段`);
            shake(10);
          }
          boss.specialTimer -= dt * (boss.phaseTwo ? 1.4 : 1);
          if (boss.specialTimer > 0) return;
          const moves = boss.spec.moves;
          bossSpecial(boss, moves[boss.specialIndex % moves.length]);
          boss.specialIndex += 1;
          boss.specialTimer = boss.spec.interval;
        }

        function bossSpecial(boss, move) {
          const aim = Math.atan2(player.y - boss.y, player.x - boss.x);
          const shot = (angle, options) =>
            fireBullet(
              "enemy",
              boss.x + Math.cos(angle) * boss.size * 0.5,
              boss.y + Math.sin(angle) * boss.size * 0.5,
              angle,
              {
                damage: boss.damage * 0.8,
                bounces: 0,
                speed: 330,
                color: boss.color,
                size: 6.5,
                life: 3.4,
                ownerTank: boss,
                ...options,
              },
            );
          if (move === "ring") {
            const count = 14 + game.stage * 2;
            const offset = rand(0, Math.PI * 2);
            for (let i = 0; i < count; i++)
              shot(offset + (Math.PI * 2 * i) / count, {});
          } else if (move === "fan") {
            for (let i = -3; i <= 3; i++) shot(aim + i * 0.13, { speed: 400 });
          } else if (move === "rail") {
            const count = boss.phaseTwo ? 3 : 1;
            for (let i = 0; i < count; i++)
              shot(aim + (i - (count - 1) / 2) * 0.22, {
                damage: boss.damage * 2,
                speed: 760,
                size: 10,
                blast: 90,
                color: "#ffffff",
              });
            shake(6);
          } else if (move === "summon") {
            const pool = stageConfig().pool.filter((type) => type !== "turret");
            if (enemies.length < 12) {
              for (let i = boss.phaseTwo ? 3 : 2; i > 0; i--)
                spawnNear(pool[irand(0, pool.length - 1)], boss.x, boss.y, 190);
              showToast(`${boss.name} 呼叫增援`);
            }
          } else if (move === "barrage") {
            for (let i = 0; i < 3 + game.stage; i++)
              callAirstrike(
                clamp(player.x + rand(-260, 260), 80, WORLD_W - 80),
                clamp(player.y + rand(-220, 220), 80, game.gateY - 60),
                rand(70, 105),
                "enemy",
              );
            showToast("首领标记了炮击区域");
          } else if (move === "mines") {
            for (let i = 0; i < 6 + game.stage; i++) {
              const a = rand(0, Math.PI * 2);
              const d = rand(120, 420);
              mines.push({
                owner: "enemy",
                x: clamp(boss.x + Math.cos(a) * d, 40, WORLD_W - 40),
                y: clamp(boss.y + Math.sin(a) * d, 40, game.gateY - 40),
                r: 11,
                arm: 0.9,
                life: 10,
                ownerTank: boss,
              });
            }
          }
        }

        function findFlankPoint(enemy, target) {
          let best = null;
          const preferred =
            enemy.type === "rocket" ? 610 : enemy.type === "heavy" ? 390 : 450;
          for (let i = 0; i < 14; i++) {
            const angle = (Math.PI * 2 * i) / 14 + enemy.strafe * 0.28;
            const point = {
              x: clamp(
                target.x + Math.cos(angle) * preferred,
                120,
                WORLD_W - 120,
              ),
              y: clamp(
                target.y + Math.sin(angle) * preferred,
                120,
                WORLD_H - 120,
              ),
            };
            if (circleHitsWall(point.x, point.y, enemy.size * 0.5)) continue;
            const lineBonus = hasLineOfSight(point, target) ? -260 : 0;
            const score =
              distance(enemy, point) + lineBonus + Math.random() * 80;
            if (!best || score < best.score) best = { point, score };
          }
          return best ? best.point : target;
        }

        function dodgeVector(enemy) {
          let x = 0;
          let y = 0;
          for (const bullet of bullets) {
            if (bullet.ownerTank === enemy) continue;
            const dx = enemy.x - bullet.x;
            const dy = enemy.y - bullet.y;
            const d = Math.hypot(dx, dy);
            if (d > 170) continue;
            const side = norm(-bullet.vy, bullet.vx);
            const sign = dx * side.x + dy * side.y > 0 ? 1 : -1;
            const power = (1 - d / 170) * 1.7;
            x += side.x * sign * power;
            y += side.y * sign * power;
          }
          return { x, y };
        }

        function enemyFire(enemy, target) {
          const spread =
            enemy.type === "boss"
              ? 0.18
              : enemy.type === "rocket" || enemy.artillery
                ? 0.05
                : 0.08;
          const count = enemy.type === "boss" ? 3 : 1;
          for (let i = 0; i < count; i++) {
            const offset = count === 1 ? 0 : (i - 1) * spread;
            const lead = target
              ? leadAngle(
                  enemy,
                  target,
                  enemy.type === "rocket" || enemy.artillery ? 430 : 390,
                )
              : enemy.turretAngle;
            fireBullet(
              "enemy",
              enemy.x + Math.cos(enemy.turretAngle) * enemy.size * 0.55,
              enemy.y + Math.sin(enemy.turretAngle) * enemy.size * 0.55,
              lead + offset + rand(-0.035, 0.035),
              {
                damage: enemy.damage,
                bounces: enemy.type === "boss" || enemy.bounces > 1 ? 1 : 0,
                speed: enemy.artillery
                  ? 360
                  : enemy.type === "rocket"
                    ? 430
                    : 390,
                color: enemy.artillery
                  ? "#f39b63"
                  : enemy.type === "rocket"
                    ? "#a78bfa"
                    : "#ff6178",
                size: enemy.type === "rocket" || enemy.artillery ? 7 : 5.5,
                blast: enemy.artillery ? 105 : enemy.type === "rocket" ? 70 : 0,
                life: 2.9,
                ownerTank: enemy,
              },
            );
          }
        }

        function leadAngle(shooter, target, speed) {
          const tx = target.x + (target.vx || 0) * 0.32;
          const ty = target.y + (target.vy || 0) * 0.32;
          return Math.atan2(ty - shooter.y, tx - shooter.x);
        }

        function hasLineOfSight(a, b) {
          const steps = 16;
          for (let i = 1; i < steps; i++) {
            const t = i / steps;
            if (wallAt(lerp(a.x, b.x, t), lerp(a.y, b.y, t), 0)) return false;
          }
          return true;
        }

        function updateBullets(dt) {
          for (let i = bullets.length - 1; i >= 0; i--) {
            const bullet = bullets[i];
            bullet.life -= dt;
            bullet.px = bullet.x;
            bullet.py = bullet.y;
            bullet.x += bullet.vx * dt;
            bullet.y += bullet.vy * dt;
            if (
              bullet.life <= 0 ||
              bullet.x < -80 ||
              bullet.x > WORLD_W + 80 ||
              bullet.y < -80 ||
              bullet.y > WORLD_H + 80
            ) {
              bullets.splice(i, 1);
              continue;
            }
            const wall = wallAt(bullet.x, bullet.y, bullet.r);
            if (wall) {
              hitWall(wall, bullet);
              if (bullet.bounces > 0 && wall.type === "steel") {
                const fromLeft =
                  bullet.px < wall.x - wall.w / 2 ||
                  bullet.px > wall.x + wall.w / 2;
                if (fromLeft) bullet.vx *= -1;
                else bullet.vy *= -1;
                bullet.bounces -= 1;
                bullet.x = bullet.px;
                bullet.y = bullet.py;
                spark(bullet.x, bullet.y, bullet.color, 10);
              } else {
                explodeBullet(bullet);
                bullets.splice(i, 1);
              }
              continue;
            }
            const barrel = barrels.find(
              (item) =>
                item.alive && distance(item, bullet) < item.r + bullet.r,
            );
            if (barrel) {
              barrel.hp -= bullet.damage;
              explodeBullet(bullet);
              bullets.splice(i, 1);
              if (barrel.hp <= 0) explodeBarrel(barrel);
              continue;
            }
            if (bullet.owner === "player") {
              const targetIndex = enemies.findIndex(
                (enemy) =>
                  distance(enemy, bullet) < enemy.size * 0.48 + bullet.r,
              );
              if (targetIndex >= 0) {
                const enemy = enemies[targetIndex];
                const side = hitSide(enemy, bullet);
                damageEnemy(
                  enemy,
                  bullet.damage * side.mult,
                  side.name,
                  player,
                );
                burst(bullet.x, bullet.y, bullet.color, 10);
                if (bullet.blast > 0)
                  explosions.push({
                    x: bullet.x,
                    y: bullet.y,
                    r: 20,
                    max: bullet.blast,
                    life: 0.26,
                    damage: bullet.damage * 0.5,
                    owner: "player",
                    color: bullet.color,
                    ownerTank: player,
                  });
                if (bullet.pierce > 0) bullet.pierce -= 1;
                else bullets.splice(i, 1);
              }
            } else {
              let consumed = false;
              if (
                player.hp > 0 &&
                bullet.ownerTank !== player &&
                distance(player, bullet) < player.size * 0.48 + bullet.r
              ) {
                damagePlayer(bullet.damage, bullet.ownerTank);
                burst(bullet.x, bullet.y, bullet.color, 12);
                if (bullet.blast > 0)
                  explosions.push({
                    x: bullet.x,
                    y: bullet.y,
                    r: 20,
                    max: bullet.blast,
                    life: 0.26,
                    damage: bullet.damage * 0.45,
                    owner: "enemy",
                    color: bullet.color,
                    ownerTank: bullet.ownerTank,
                  });
                bullets.splice(i, 1);
                consumed = true;
              }
            }
          }
        }

        function hitWall(wall, bullet) {
          if (wall.type !== "brick") return;
          wall.hp -= bullet.damage;
          spark(bullet.x, bullet.y, "#ffd166", 8);
          if (wall.hp <= 0) {
            const index = walls.indexOf(wall);
            if (index >= 0) walls.splice(index, 1);
            wallsDirty = true;
            game.score += 8;
            burst(wall.x, wall.y, "#ffb25f", 18);
            if (Math.random() < 0.12)
              parts.push(makePickup(wall.x, wall.y, "scrap", 1));
          }
        }

        function explodeBullet(bullet) {
          if (bullet.blast > 0) {
            explosions.push({
              x: bullet.x,
              y: bullet.y,
              r: 20,
              max: bullet.blast,
              life: 0.28,
              damage: bullet.damage * 0.55,
              owner: bullet.owner,
              color: bullet.color,
              ownerTank: bullet.ownerTank || null,
            });
          } else {
            spark(bullet.x, bullet.y, bullet.color, 7);
          }
        }

        function hitSide(enemy, bullet) {
