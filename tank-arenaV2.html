          const incoming = Math.atan2(bullet.vy, bullet.vx);
          const rear = Math.cos(incoming - enemy.bodyAngle);
          const flank = Math.abs(Math.sin(incoming - enemy.bodyAngle));
          if (rear > 0.48) return { name: "后甲", mult: 1.55 };
          if (flank > 0.72) return { name: "侧甲", mult: 1.25 };
          return { name: "正甲", mult: 0.82 };
        }

        function damageEnemy(enemy, amount, side) {
          if (enemy.hp <= 0) return;
          if (enemy.dormant) {
            if (enemy === game.boss) {
              addFloater("闸门护盾", enemy.x, enemy.y - enemy.size * 0.6, "#9fb0c8");
              return;
            }
            wakeSquad(enemy);
          }
          const armorFactor = side === "正甲" ? 1 - (enemy.frontArmor || 0) : 1;
          enemy.hp -= Math.max(1, amount * armorFactor);
          addFloater(
            side === "front" ? "-伤害" : side,
            enemy.x,
            enemy.y - enemy.size * 0.6,
            side === "正甲" ? "#9fb0c8" : "#ffd166",
          );
          if (enemy.hp > 0) return;
          const index = enemies.indexOf(enemy);
          if (index >= 0) enemies.splice(index, 1);
          awardKill(enemy);
          burst(enemy.x, enemy.y, enemy.color, enemy.type === "boss" ? 70 : 28);
          explosions.push({
            x: enemy.x,
            y: enemy.y,
            r: 26,
            max: enemy.type === "boss" ? 260 : 110,
            life: 0.38,
            damage: 0,
            owner: "player",
            color: enemy.color,
            visualOnly: true,
          });
          dropLoot(enemy);
          if (enemy === game.boss) onBossDefeated();
        }

        function awardKill(victim) {
          const value = Math.round(victim.score);
          game.score += value;
          player.kills += 1;
          healPlayer(victim.type === "boss" ? 30 : 4);
          addFloater(`+${value}`, victim.x, victim.y, "#4ade80");
        }

        function damagePlayer(amount) {
          const now = performance.now() / 1000;
          if (player.shieldUntil > now) {
            spark(player.x, player.y, "#38d9ff", 12);
            return;
          }
          if (now - player.lastHitAt < PLAYER_HIT_GRACE) return;
          player.lastHitAt = now;
          let taken =
            amount *
            PLAYER_DAMAGE_TAKEN *
            (1 - (player.frontArmor || 0) * 0.5) *
            (1 - player.damageReduce);
          if (player.energyShield > 0) {
            const absorbed = Math.min(player.energyShield, taken);
            player.energyShield -= absorbed;
            taken -= absorbed;
            spark(player.x, player.y, "#38d9ff", 8);
            if (player.energyShield <= 0) showToast("护盾击穿");
          }
          player.hp = Math.max(0, player.hp - taken);
          shake(8);
          addFloater(
            `-${Math.round(taken)}`,
            player.x,
            player.y - 34,
            taken > 0 ? "#ff6178" : "#38d9ff",
          );
        }

        function healPlayer(amount) {
          player.hp = Math.min(player.maxHp, player.hp + amount);
        }

        function updateMines(dt) {
          for (let i = mines.length - 1; i >= 0; i--) {
            const mine = mines[i];
            mine.arm -= dt;
            mine.life -= dt;
            let target =
              mine.owner === "player"
                ? enemies.find(
                    (enemy) => distance(enemy, mine) < enemy.size * 0.48 + 24,
                  )
                : distance(player, mine) < player.size * 0.48 + 24;
            if ((mine.arm <= 0 && target) || mine.life <= 0) {
              explosions.push({
                x: mine.x,
                y: mine.y,
                r: 18,
                max: 118,
                life: 0.32,
                damage: mine.owner === "player" ? 48 : 24,
                owner: mine.owner,
                color: mine.owner === "player" ? "#4ade80" : "#ff6178",
                ownerTank: mine.ownerTank || null,
              });
              mines.splice(i, 1);
            }
          }
        }

        function updateExplosions(dt) {
          for (let i = explosions.length - 1; i >= 0; i--) {
            const boom = explosions[i];
            const previous = boom.r;
            boom.life -= dt;
            boom.r = lerp(boom.r, boom.max, 1 - Math.pow(0.02, dt));
            if (!boom.visualOnly) {
              if (boom.owner === "player" || boom.owner === "neutral") {
                for (const enemy of enemies) {
                  const d = distance(enemy, boom);
                  if (d < boom.r && d >= previous - 10)
                    damageEnemy(
                      enemy,
                      boom.damage * (1 - d / boom.max),
                      "爆破",
                      boom.ownerTank ||
                        (boom.owner === "player" ? player : null),
                    );
                }
              }
              if (
                (boom.owner === "enemy" || boom.owner === "neutral") &&
                distance(player, boom) < boom.r &&
                distance(player, boom) >= previous - 10
              ) {
                damagePlayer(boom.damage * 0.8, boom.ownerTank || null);
              }
              for (const barrel of barrels) {
                if (
                  barrel.alive &&
                  distance(barrel, boom) < boom.r + barrel.r
                ) {
                  barrel.hp = 0;
                  explodeBarrel(barrel);
                }
              }
            }
            if (boom.life <= 0) explosions.splice(i, 1);
          }
        }

        function explodeBarrel(barrel) {
          if (!barrel.alive) return;
          barrel.alive = false;
          explosions.push({
            x: barrel.x,
            y: barrel.y,
            r: 18,
            max: 180,
            life: 0.38,
            damage: 62,
            owner: "neutral",
            color: "#ffd166",
          });
          burst(barrel.x, barrel.y, "#ffd166", 36);
          shake(9);
        }

        function updateEffects(dt) {
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life -= dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= Math.pow(0.04, dt);
            p.vy *= Math.pow(0.04, dt);
            if (p.life <= 0) particles.splice(i, 1);
          }
          for (let i = floaters.length - 1; i >= 0; i--) {
            const f = floaters[i];
            f.life -= dt;
            f.y -= dt * 34;
            if (f.life <= 0) floaters.splice(i, 1);
          }
        }

        function updateCamera(dt) {
          const zoom = getZoom();
          const halfW = view.w / zoom / 2;
          const halfH = view.h / zoom / 2;
          const lookAhead = Math.min(halfH * 0.28, 170);
          camera.x = lerp(camera.x, player.x, 1 - Math.pow(0.002, dt));
          camera.y = lerp(
            camera.y,
            player.y - lookAhead,
            1 - Math.pow(0.002, dt),
          );
          camera.x =
            halfW * 2 >= WORLD_W
              ? WORLD_W / 2
              : clamp(camera.x, halfW, WORLD_W - halfW);
          camera.y =
            halfH * 2 >= WORLD_H
              ? WORLD_H / 2
              : clamp(camera.y, halfH, WORLD_H - halfH);
        }

        function checkStage(dt) {
          if (!game.bossActive && player.y < game.gateY - player.size * 0.55)
            activateBoss();
          if (!game.bossDefeated) return;
          game.clearTimer -= dt;
          if (game.clearTimer > 0) return;
          if (game.stage >= game.maxStage) endGame(true);
          else openShop("reward");
        }

        function activateBoss() {
          game.bossActive = true;
          for (let c = GATE_GAP[0]; c <= GATE_GAP[1]; c++) {
            const wall = makeWall(cellX(c), cellY(GATE_ROW), TILE, TILE, "steel");
            wall.gate = true;
            walls.push(wall);
          }
          wallsDirty = true;
          enemies = enemies.filter(
            (enemy) =>
              enemy === game.boss || enemy.y < game.gateY - enemy.size * 0.5,
          );
          bullets = bullets.filter((bullet) => bullet.y < game.gateY + TILE);
          const boss = game.boss;
          boss.dormant = false;
          boss.reloadLeft = 1.2;
          boss.specialTimer = 2;
          showToast(`关底首领：${boss.name}`);
          shake(12);
        }

        function onBossDefeated() {
          game.bossDefeated = true;
          game.bossKills += 1;
          game.clearTimer = 2.4;
          const bonus = 18 + game.stage * 8;
          player.scrap += bonus;
          game.score += 1500 * game.stage;
          for (const enemy of enemies) {
            enemy.hp = 0;
            burst(enemy.x, enemy.y, enemy.color, 18);
          }
          enemies = [];
          bullets = bullets.filter((bullet) => bullet.owner === "player");
          mines = mines.filter((mine) => mine.owner === "player");
          airstrikes = [];
          healPlayer(
            player.maxHp * (0.25 + (garageSave.tech.recovery || 0) * 0.02),
          );
          shake(16);
          showToast(`${game.boss.name} 已击毁！零件 +${bonus}`);
        }

        let shopKind = "pause";
        let rewardTaken = true;

        function openShop(kind) {
          if (kind === "pause" && game.state !== "playing") return;
          shopKind = kind;
          rewardTaken = kind !== "reward";
          game.state = "shop";
          pointer.down = false;
          upgradeGrid.innerHTML = "";
          if (kind === "reward") {
            upgradeTitle.textContent = `第 ${game.stage} 关突破！选择一项首领战利品，再用零件改装`;
            for (const upgrade of pickUpgrades()) {
              const button = document.createElement("button");
              button.className = "upgrade-card";
              button.innerHTML = `<strong>${upgrade.title}</strong><span>${upgrade.text}</span>`;
              button.addEventListener("click", () => {
                if (rewardTaken) return;
                upgrade.apply();
                rewardTaken = true;
                button.classList.add("picked");
                upgradeGrid
                  .querySelectorAll("button")
                  .forEach((item) => (item.disabled = item !== button));
                renderShop();
                updateHud(true);
              });
              upgradeGrid.appendChild(button);
            }
            upgradeGrid.classList.remove("hidden");
          } else {
            upgradeTitle.textContent = "战车改装（战斗已暂停）";
            upgradeGrid.classList.add("hidden");
          }
          renderShop();
          upgradeOverlay.classList.remove("hidden");
        }

        function shopCost(item) {
          return item.cost
            ? item.cost()
            : item.base + item.step * (player.upgrades[item.id] || 0);
        }

        function renderShop() {
          shopScrap.textContent = `零件 ${player.scrap} · 装甲 ${Math.round(player.hp)}/${player.maxHp} · 备用车体 ${player.lives}`;
          shopGrid.innerHTML = SHOP.map((item) => {
            const level = player.upgrades[item.id] || 0;
            const maxed = item.max && level >= item.max;
            const cost = shopCost(item);
            const levelText = item.consumable
              ? "补给"
              : `Lv.${level}${item.max ? `/${item.max}` : ""}`;
            return `<button class="shop-card" data-shop="${item.id}" ${maxed || player.scrap < cost ? "disabled" : ""}><small>${item.group}</small><strong>${item.name} <b>${levelText}</b></strong><span>${item.text}</span><em>${maxed ? "已满级" : `零件 ${cost}`}</em></button>`;
          }).join("");
          shopContinue.disabled = !rewardTaken;
          shopContinue.textContent =
            shopKind !== "reward"
              ? "返回战斗"
              : rewardTaken
                ? `出发：第 ${game.stage + 1} 关 · ${STAGES[game.stage].name}`
                : "先选择一项战利品";
        }

        function buyShop(id) {
          const item = SHOP.find((entry) => entry.id === id);
          if (!item || game.state !== "shop") return;
          const level = player.upgrades[item.id] || 0;
          const cost = shopCost(item);
          if ((item.max && level >= item.max) || player.scrap < cost) return;
          player.scrap -= cost;
          if (!item.consumable) player.upgrades[item.id] = level + 1;
          item.apply();
          renderShop();
          updateHud(true);
        }

        function closeShop() {
          if (game.state !== "shop" || !rewardTaken) return;
          upgradeOverlay.classList.add("hidden");
          pointer.down = false;
          if (shopKind === "reward") {
            game.stage += 1;
            loadStage();
          } else {
            game.state = "playing";
            showToast("改装完成");
          }
        }

        function pickUpgrades() {
          const bag = [...UPGRADES];
          const choices = [];
          while (choices.length < 3 && bag.length) {
            const index = Math.floor(Math.random() * bag.length);
            choices.push(bag.splice(index, 1)[0]);
          }
          return choices;
        }

        function endGame(won) {
          if (game.state === "ended") return;
          game.state = "ended";
          upgradeOverlay.classList.add("hidden");
          game.best = Math.max(game.best, game.score);
          garageSave.best = Math.max(garageSave.best || 0, game.best);
          const credits = Math.max(
            1,
            Math.floor(
              (game.score / 420 +
                player.kills * 1.4 +
                game.bossKills * 8 +
                (won ? 20 : 0)) *
                (1 + (garageSave.tech.salvage || 0) * 0.06),
            ),
          );
          garageSave.credits += credits;
          garageSave.totalKills = (garageSave.totalKills || 0) + player.kills;
          garageSave.bosses = (garageSave.bosses || 0) + game.bossKills;
          garageSave.wins = (garageSave.wins || 0) + (won ? 1 : 0);
          const record = garageSave.records[MODE_KEY] || {
            plays: 0,
            wins: 0,
            best: 0,
            stage: 0,
          };
          record.plays += 1;
          record.wins += won ? 1 : 0;
          record.best = Math.max(record.best, Math.round(game.score));
          record.stage = Math.max(record.stage || 0, game.stage);
          garageSave.records[MODE_KEY] = record;
          garageSave.mastery.chassis[selectedChassis] =
            (garageSave.mastery.chassis[selectedChassis] || 0) + 1;
          garageSave.mastery.cannon[selectedCannon] =
            (garageSave.mastery.cannon[selectedCannon] || 0) + 1;
          const milestoneBonus = settleMilestones();
          saveGarage();
          const stage = stageConfig();
          overlayTitle.textContent = won ? "五关全破" : "装甲失效";
          overlayText.textContent = won
            ? `你一路向北击穿了五座关底堡垒，${stage.boss.name}已化为废墟。得分 ${Math.round(game.score)}，击毁 ${player.kills}。最高纪录 ${Math.round(game.best)}。`
            : `你的战车倒在第 ${game.stage} 关「${stage.name}」${game.bossActive ? `，与${stage.boss.name}的决战中` : ""}。得分 ${Math.round(game.score)}，击毁 ${player.kills}。最高纪录 ${Math.round(game.best)}。`;
          overlayText.textContent += ` 本次获得军功 ${credits}。`;
          if (milestoneBonus)
            overlayText.textContent += ` 里程碑额外奖励 ${milestoneBonus} 军功。`;
          startBtn.textContent = "重新部署";
          overlay.classList.remove("hidden");
          renderGarage();
          updateHud(true);
        }

        function updateHud(force) {
          if (!player || !game.stage || (!force && game.state === "shop"))
            return;
          waveValue.textContent = `${game.stage}/${STAGES.length}`;
          scoreValue.textContent = Math.round(game.score);
          bestValue.textContent = Math.round(
            Math.max(game.best || 0, game.score),
          );
          enemyValue.textContent = enemies.length;
          armorValue.textContent = Math.round(player.hp);
          healthBar.style.width = `${clamp((player.hp / player.maxHp) * 100, 0, 100)}%`;
          shieldBar.style.width = `${clamp((player.energyShield / maxEnergyShield(player)) * 100, 0, 100)}%`;
          reloadBar.style.width = `${clamp((1 - player.reloadLeft / player.reload) * 100, 0, 100)}%`;
          shellValue.textContent = player.shellName;
          bounceValue.textContent = String(player.bounces);
          partValue.textContent = String(player.scrap || 0);
          lifeValue.textContent = String(player.lives);
          const startY = WORLD_H - TILE * 2.5;
          const progress = clamp(
            Math.round(((startY - player.y) / (startY - game.gateY)) * 100),
            0,
            100,
          );
          objectiveValue.textContent = game.bossDefeated
            ? "关卡突破"
            : game.bossActive
              ? `击毁${game.boss.name}`
              : `向北推进 ${progress}%`;
          const skillNames = {
            vanguard: "电磁脉冲",
            interceptor: "截击超频",
            bastion: "堡垒壁垒",
            engineer: "工程支援",
            specter: "幻影相位",
            juggernaut: "破城震荡",
          };
          skillValue.textContent =
            player.skillLeft <= 0
              ? skillNames[player.chassis]
              : `${player.skillLeft.toFixed(1)}s`;
        }

        let shakePower = 0;
        function shake(amount) {
          shakePower = Math.min(18, shakePower + amount);
        }

        function burst(x, y, color, count) {
          for (let i = 0; i < count; i++) {
            const a = rand(0, Math.PI * 2);
            const s = rand(60, 340);
            particles.push({
              x,
              y,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s,
              r: rand(2, 5),
              life: rand(0.35, 0.85),
              max: 0.85,
              color,
            });
          }
          if (particles.length > 520)
            particles.splice(0, particles.length - 520);
        }

        function spark(x, y, color, count) {
          burst(x, y, color, count);
        }

        function addFloater(text, x, y, color) {
          floaters.push({ text, x, y, color, life: 0.85, max: 0.85 });
          if (floaters.length > 80) floaters.shift();
        }

        function draw() {
          const zoom = getZoom();
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, view.w, view.h);
          ctx.fillStyle = "#071015";
          ctx.fillRect(0, 0, view.w, view.h);
          const sx = shakePower ? rand(-shakePower, shakePower) : 0;
          const sy = shakePower ? rand(-shakePower, shakePower) : 0;
          shakePower *= 0.86;
          if (shakePower < 0.1) shakePower = 0;
          ctx.save();
          ctx.translate(view.w / 2 + sx, view.h / 2 + sy);
          ctx.scale(zoom, zoom);
          ctx.translate(-camera.x, -camera.y);
          drawWorld();
          drawWalls();
          drawBarrels();
          drawParts();
          drawAirstrikes();
          drawMines();
          drawBullets();
          drawTanks();
          drawExplosions();
          drawParticles();
          drawFloaters();
          ctx.restore();
          drawVignette();
          drawStageUi();
        }

        function drawWorld() {
          const stage = stageConfig();
          const halfH = view.h / getZoom() / 2 + TILE;
          const top = Math.max(0, camera.y - halfH);
          const bottom = Math.min(WORLD_H, camera.y + halfH);
          ctx.fillStyle = stage.floor;
          ctx.fillRect(0, 0, WORLD_W, WORLD_H);
          ctx.fillStyle = "rgba(255, 51, 85, 0.06)";
          ctx.fillRect(0, 0, WORLD_W, GATE_ROW * TILE);
          ctx.strokeStyle = stage.grid;
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let x = 0; x <= WORLD_W; x += TILE) {
            ctx.moveTo(x, top);
            ctx.lineTo(x, bottom);
          }
          for (let y = Math.floor(top / TILE) * TILE; y <= bottom; y += TILE) {
            ctx.moveTo(0, y);
            ctx.lineTo(WORLD_W, y);
          }
          ctx.stroke();
          ctx.strokeStyle = "rgba(74, 222, 128, 0.35)";
          ctx.lineWidth = 3;
          ctx.setLineDash([12, 10]);
          ctx.strokeRect(WORLD_W / 2 - TILE * 2, WORLD_H - TILE * 4, TILE * 4, TILE * 3);
          ctx.setLineDash([]);
          if (!game.bossActive) {
            const gapX = GATE_GAP[0] * TILE;
            const gapW = (GATE_GAP[1] - GATE_GAP[0] + 1) * TILE;
            ctx.fillStyle = "rgba(255, 51, 85, 0.16)";
            ctx.fillRect(gapX, GATE_ROW * TILE, gapW, TILE);
            ctx.font = "800 22px Microsoft YaHei, Segoe UI, sans-serif";
            ctx.textAlign = "center";
            ctx.fillStyle = "rgba(255, 97, 120, 0.85)";
            ctx.fillText("▲ 首领区域 ▲", WORLD_W / 2, GATE_ROW * TILE + TILE / 2 + 8);
          }
          ctx.globalAlpha = 0.35;
          ctx.strokeStyle = stage.accent;
          ctx.lineWidth = 10;
          ctx.strokeRect(5, 5, WORLD_W - 10, WORLD_H - 10);
          ctx.globalAlpha = 1;
        }

        function drawWalls() {
          const halfH = view.h / getZoom() / 2 + TILE;
          for (const wall of walls) {
            if (Math.abs(wall.y - camera.y) > halfH) continue;
            const isSteel = wall.type === "steel";
            ctx.fillStyle = wall.gate ? "#4a1f2a" : isSteel ? "#27374a" : "#58393a";
            ctx.strokeStyle = wall.gate
              ? "rgba(255, 97, 120, 0.85)"
              : isSteel
                ? "rgba(135, 168, 204, 0.55)"
                : "rgba(255, 178, 95, 0.46)";
            ctx.lineWidth = 2;
            roundRect(
              wall.x - wall.w / 2,
              wall.y - wall.h / 2,
              wall.w,
              wall.h,
              6,
              true,
              true,
            );
            if (!isSteel) {
              ctx.fillStyle = `rgba(255, 209, 102, ${0.13 + (wall.hp / wall.maxHp) * 0.14})`;
              ctx.fillRect(wall.x - wall.w / 2 + 6, wall.y - 4, wall.w - 12, 8);
            }
          }
        }

        function drawBarrels() {
          for (const barrel of barrels) {
            if (!barrel.alive) continue;
            ctx.save();
            ctx.translate(barrel.x, barrel.y);
            ctx.fillStyle = "#67441e";
            ctx.strokeStyle = "#ffd166";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, barrel.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "rgba(255, 209, 102, 0.35)";
            ctx.fillRect(-barrel.r * 0.62, -4, barrel.r * 1.24, 8);
            ctx.restore();
          }
        }

        function drawParts() {
          for (const part of parts) {
            ctx.save();
            ctx.translate(part.x, part.y);
            ctx.rotate(part.spin);
            if (part.kind === "scrap") {
              const s = 6 + Math.min(4, part.value);
              ctx.fillStyle = "rgba(255, 209, 102, 0.85)";
              ctx.strokeStyle = "#fff3c4";
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(0, -s);
              ctx.lineTo(s, 0);
              ctx.lineTo(0, s);
              ctx.lineTo(-s, 0);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.restore();
              continue;
            }
            ctx.fillStyle =
              part.kind === "module"
                ? "rgba(192, 132, 252, 0.18)"
                : part.kind === "repair"
                  ? "rgba(74, 222, 128, 0.16)"
                  : "rgba(56, 217, 255, 0.16)";
            ctx.strokeStyle = part.color;
            ctx.lineWidth = 2;
            roundRect(-11, -11, 22, 22, 5, true, true);
            ctx.beginPath();
            if (part.kind === "repair") {
              ctx.moveTo(-6, 0);
              ctx.lineTo(6, 0);
              ctx.moveTo(0, -6);
              ctx.lineTo(0, 6);
            } else if (part.kind === "shield") {
              ctx.arc(0, 0, 6, 0, Math.PI * 2);
            } else {
              ctx.moveTo(-7, -4);
              ctx.lineTo(0, -8);
              ctx.lineTo(7, -4);
              ctx.moveTo(-7, 4);
              ctx.lineTo(0, 8);
              ctx.lineTo(7, 4);
            }
            ctx.stroke();
            ctx.restore();
          }
        }

        function drawAirstrikes() {
          for (const strike of airstrikes) {
            if (strike.exploded) continue;
            ctx.fillStyle = "rgba(255, 97, 120, 0.12)";
            ctx.strokeStyle = "rgba(255, 139, 95, 0.9)";
            ctx.lineWidth = 4;
            ctx.setLineDash([14, 10]);
            ctx.beginPath();
            ctx.arc(strike.x, strike.y, strike.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }

        function drawMines() {
          for (const mine of mines) {
            ctx.save();
            ctx.translate(mine.x, mine.y);
            ctx.strokeStyle = mine.owner === "player" ? "#4ade80" : "#ff6178";
            ctx.fillStyle =
              mine.arm > 0
                ? "rgba(159, 176, 200, 0.34)"
                : "rgba(255, 255, 255, 0.08)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, mine.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
        }

        function drawBullets() {
          ctx.lineCap = "round";
          for (const bullet of bullets) {
            ctx.strokeStyle = bullet.color;
            ctx.lineWidth = bullet.r * 1.1;
            ctx.globalAlpha = 0.35;
            ctx.beginPath();
            ctx.moveTo(
              bullet.x - bullet.vx * 0.035,
              bullet.y - bullet.vy * 0.035,
            );
            ctx.lineTo(bullet.x, bullet.y);
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.fillStyle = bullet.color;
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function drawTanks() {
          for (const enemy of enemies) drawTank(enemy, false);
          for (const drone of drones) drawDrone(drone);
          drawTank(player, true);
        }

        function drawTank(tank, isPlayer) {
          const color = isPlayer ? "#38d9ff" : tank.color;
          const size = tank.size;
          ctx.save();
          ctx.translate(tank.x, tank.y);
          const hpRatio = tank.hp / tank.maxHp;
          if (!isPlayer) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
            ctx.beginPath();
            ctx.ellipse(
              0,
              size * 0.38,
              size * 0.56,
              size * 0.24,
              0,
              0,
              Math.PI * 2,
            );
            ctx.fill();
          }
          ctx.rotate(tank.bodyAngle);
          ctx.fillStyle = isPlayer ? "#15394a" : "#2a2430";
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          roundRect(
            -size * 0.5,
            -size * 0.36,
            size,
            size * 0.72,
            9,
            true,
            true,
          );
          ctx.fillStyle = "rgba(255, 255, 255, 0.10)";
          ctx.fillRect(-size * 0.42, -size * 0.47, size * 0.84, 5);
          ctx.fillRect(-size * 0.42, size * 0.42, size * 0.84, 5);
          ctx.restore();

          ctx.save();
          ctx.translate(tank.x, tank.y);
          ctx.rotate(tank.turretAngle);
          ctx.strokeStyle = color;
          ctx.lineWidth = isPlayer ? 8 : 6;
          ctx.beginPath();
          ctx.moveTo(size * 0.08, 0);
          ctx.lineTo(size * 0.72, 0);
          ctx.stroke();
          ctx.fillStyle = isPlayer ? "#0f2734" : "#201b28";
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, size * 0.27, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();

          if (isPlayer && player.shieldUntil > performance.now() / 1000) {
            ctx.strokeStyle = "rgba(56, 217, 255, 0.72)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(
              tank.x,
              tank.y,
              size * 0.78 + Math.sin(performance.now() / 90) * 3,
              0,
              Math.PI * 2,
            );
            ctx.stroke();
          }

          if (isPlayer && player.energyShield > 0) {
            ctx.strokeStyle = `rgba(56, 217, 255, ${0.12 + 0.3 * (player.energyShield / maxEnergyShield(player))})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(tank.x, tank.y, size * 0.7, 0, Math.PI * 2);
            ctx.stroke();
          }

          if (!isPlayer) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
            ctx.fillRect(tank.x - size * 0.5, tank.y - size * 0.75, size, 5);
            ctx.fillStyle = hpRatio > 0.45 ? "#4ade80" : "#ff6178";
            ctx.fillRect(
              tank.x - size * 0.5,
              tank.y - size * 0.75,
              size * clamp(hpRatio, 0, 1),
              5,
            );
          }
        }

        function drawDrone(drone) {
          ctx.save();
          ctx.translate(drone.x, drone.y);
          ctx.strokeStyle = "#4ade80";
          ctx.fillStyle = "rgba(74, 222, 128, 0.18)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 13, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        function drawExplosions() {
          for (const boom of explosions) {
            const alpha = clamp(boom.life / 0.4, 0, 1);
            ctx.strokeStyle = boom.color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(boom.x, boom.y, boom.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = boom.color;
            ctx.globalAlpha = alpha * 0.08;
            ctx.beginPath();
            ctx.arc(boom.x, boom.y, boom.r * 0.72, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
        }

        function drawParticles() {
          for (const p of particles) {
            ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        function drawFloaters() {
          ctx.font = "700 16px Microsoft YaHei, Segoe UI, sans-serif";
          ctx.textAlign = "center";
          for (const f of floaters) {
            ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
            ctx.fillStyle = f.color;
            ctx.fillText(f.text, f.x, f.y);
          }
          ctx.globalAlpha = 1;
        }

        function drawStageUi() {
          if (!player || !game.stage || !WORLD_H) return;
          const desktop = view.w > 860;
          const y0 = desktop ? 330 : 150;
          const y1 = view.h - (desktop ? 120 : 250);
          if (y1 - y0 > 90) {
            const x = view.w - 22;
            const w = 12;
            const scale = (y1 - y0) / WORLD_H;
            ctx.fillStyle = "rgba(5, 10, 16, 0.7)";
            roundRect(x - 3, y0 - 3, w + 6, y1 - y0 + 6, 5, true, false);
            ctx.fillStyle = "rgba(255, 51, 85, 0.35)";
            ctx.fillRect(x, y0, w, GATE_ROW * TILE * scale);
            ctx.fillStyle = "#ff6178";
            for (const enemy of enemies) {
              ctx.globalAlpha = enemy.dormant ? 0.45 : 1;
              ctx.fillRect(
                x + (enemy.x / WORLD_W) * w - 1,
                y0 + enemy.y * scale - 1,
                enemy === game.boss ? 4 : 2,
                enemy === game.boss ? 4 : 2,
              );
            }
            ctx.globalAlpha = 1;
            ctx.fillStyle = "#38d9ff";
            ctx.beginPath();
            const py = y0 + player.y * scale;
            ctx.moveTo(x + w / 2, py - 6);
            ctx.lineTo(x + w + 3, py + 5);
            ctx.lineTo(x - 3, py + 5);
            ctx.closePath();
            ctx.fill();
          }
          const boss = game.boss;
          if (game.bossActive && boss && !game.bossDefeated) {
            const w = Math.min(520, view.w * 0.7);
            const x = (view.w - w) / 2;
            const y = view.h - (desktop ? 100 : 182);
            ctx.fillStyle = "rgba(5, 10, 16, 0.78)";
            roundRect(x - 12, y - 28, w + 24, 46, 8, true, false);
            ctx.font = "800 13px Microsoft YaHei, Segoe UI, sans-serif";
            ctx.textAlign = "left";
            ctx.fillStyle = "#ffffff";
            ctx.fillText(
              `第 ${game.stage} 关首领 · ${boss.name}${boss.phaseTwo ? " · 狂暴" : ""}`,
              x,
              y - 9,
            );
            ctx.textAlign = "right";
            ctx.fillStyle = "#9fb0c8";
            ctx.fillText(`${Math.max(0, Math.ceil(boss.hp))}`, x + w, y - 9);
            ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
            ctx.fillRect(x, y, w, 9);
            ctx.fillStyle = boss.color;
            ctx.fillRect(x, y, w * clamp(boss.hp / boss.maxHp, 0, 1), 9);
          }
        }

        function drawVignette() {
          const grad = ctx.createRadialGradient(
            view.w / 2,
            view.h / 2,
            Math.min(view.w, view.h) * 0.2,
            view.w / 2,
            view.h / 2,
            Math.max(view.w, view.h) * 0.66,
          );
          grad.addColorStop(0, "rgba(0, 0, 0, 0)");
          grad.addColorStop(1, "rgba(0, 0, 0, 0.42)");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, view.w, view.h);
        }

        function roundRect(x, y, w, h, r, fill, stroke) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        function loop(now) {
          const dt = Math.min(0.033, (now - lastFrame) / 1000);
          lastFrame = now;
          update(dt, now / 1000);
          draw();
          requestAnimationFrame(loop);
        }

        function setPointerFromEvent(event) {
          const rect = canvas.getBoundingClientRect();
          pointer.x = event.clientX - rect.left;
          pointer.y = event.clientY - rect.top;
          updatePointerWorld();
        }

        function resetMoveJoystick() {
          touchMove = { active: false, id: null, x: 0, y: 0, dx: 0, dy: 0 };
          moveJoystickThumb.style.left = "50%";
          moveJoystickThumb.style.top = "50%";
        }

        function updateMoveJoystick(event) {
          const rect = moveJoystick.getBoundingClientRect();
          const cx = rect.width / 2;
          const cy = rect.height / 2;
          const max = rect.width * 0.34;
          const rawX = event.clientX - rect.left - cx;
          const rawY = event.clientY - rect.top - cy;
          const len = Math.hypot(rawX, rawY);
          const scale = len > max ? max / len : 1;
          const dx = rawX * scale;
          const dy = rawY * scale;
          touchMove.dx = dx / max;
          touchMove.dy = dy / max;
          moveJoystickThumb.style.left = `${cx + dx}px`;
          moveJoystickThumb.style.top = `${cy + dy}px`;
        }

        function isTouchUiTarget(target) {
          return Boolean(
            target &&
            target.closest &&
            target.closest(
              "#moveJoystick, .fire-btn, .skill-btn, .controls, button",
            ),
          );
        }

        window.addEventListener("resize", resize);
        window.addEventListener("keydown", (event) => {
          keys.add(event.code);
          if (event.code === "Space") {
            event.preventDefault();
            playerShoot();
          }
          if (
            event.code === "ShiftLeft" ||
            event.code === "ShiftRight" ||
            event.code === "KeyE"
          )
            useSkill();
          if (event.code === "KeyB") {
            if (game.state === "shop") closeShop();
            else openShop("pause");
          }
          if (event.code === "Escape" && game.state === "shop") closeShop();
          if (event.code === "KeyP") togglePause();
          if (event.code === "KeyR") newGame();
        });
        window.addEventListener("keyup", (event) => keys.delete(event.code));
        canvas.addEventListener("pointermove", setPointerFromEvent);
        canvas.addEventListener("pointerdown", (event) => {
          setPointerFromEvent(event);
          pointer.down = true;
          canvas.setPointerCapture(event.pointerId);
        });
        canvas.addEventListener("pointerup", () => {
          pointer.down = false;
        });
        canvas.addEventListener("pointercancel", () => {
          pointer.down = false;
        });
        canvas.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          useSkill();
        });

        moveJoystick.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          touchMove.active = true;
          touchMove.id = event.pointerId;
          moveJoystick.setPointerCapture(event.pointerId);
          updateMoveJoystick(event);
        });
        moveJoystick.addEventListener("pointermove", (event) => {
          if (!touchMove.active || event.pointerId !== touchMove.id) return;
          event.preventDefault();
          event.stopPropagation();
          updateMoveJoystick(event);
        });
        function releaseMoveJoystick(event) {
          if (
            event &&
            touchMove.id !== null &&
            event.pointerId !== touchMove.id
          )
            return;
          if (event) {
            event.preventDefault();
            event.stopPropagation();
          }
          resetMoveJoystick();
        }
        moveJoystick.addEventListener("pointerup", releaseMoveJoystick);
        moveJoystick.addEventListener("pointercancel", releaseMoveJoystick);
        moveJoystick.addEventListener(
          "lostpointercapture",
          releaseMoveJoystick,
        );

        window.addEventListener(
          "touchstart",
          (event) => {
            for (const touch of event.changedTouches) {
              if (isTouchUiTarget(touch.target)) continue;
              if (touch.clientX < view.w * 0.48 && !touchMove.active) {
                touchMove = {
                  active: true,
                  id: touch.identifier,
                  x: touch.clientX,
                  y: touch.clientY,
                  dx: 0,
                  dy: 0,
                };
              } else if (!touchAim.active) {
                touchAim = {
                  active: true,
                  id: touch.identifier,
                  x: touch.clientX,
                  y: touch.clientY,
                };
                pointer.x = touch.clientX;
                pointer.y = touch.clientY;
                pointer.down = true;
              }
            }
          },
          { passive: false },
        );
        window.addEventListener(
          "touchmove",
          (event) => {
            for (const touch of event.changedTouches) {
              if (isTouchUiTarget(touch.target)) continue;
              if (touch.identifier === touchMove.id) {
                const dx = touch.clientX - touchMove.x;
                const dy = touch.clientY - touchMove.y;
                const n = norm(dx, dy);
                const power = clamp(Math.hypot(dx, dy) / 72, 0, 1);
                touchMove.dx = n.x * power;
                touchMove.dy = n.y * power;
              }
              if (touch.identifier === touchAim.id) {
                pointer.x = touch.clientX;
                pointer.y = touch.clientY;
              }
            }
            updatePointerWorld();
          },
          { passive: false },
        );
        window.addEventListener("touchend", endTouch, { passive: false });
        window.addEventListener("touchcancel", endTouch, { passive: false });

        function endTouch(event) {
          for (const touch of event.changedTouches) {
            if (isTouchUiTarget(touch.target)) continue;
            if (touch.identifier === touchMove.id)
              touchMove = { active: false, id: null, x: 0, y: 0, dx: 0, dy: 0 };
            if (touch.identifier === touchAim.id) {
              touchAim = { active: false, id: null, x: 0, y: 0 };
              pointer.down = false;
            }
          }
        }

        pauseBtn.addEventListener("click", togglePause);
        restartBtn.addEventListener("click", newGame);
        shopBtn.addEventListener("click", () => openShop("pause"));
        shopContinue.addEventListener("click", closeShop);
        shopGrid.addEventListener("click", (event) => {
          const button = event.target.closest("[data-shop]");
          if (button) buyShop(button.dataset.shop);
        });
        fireBtn.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          pointer.down = true;
          playerShoot();
        });
        fireBtn.addEventListener("pointerup", (event) => {
          event.preventDefault();
          event.stopPropagation();
          pointer.down = false;
        });
        fireBtn.addEventListener("pointercancel", () => {
          pointer.down = false;
        });
        skillBtn.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          useSkill();
        });
        skillBtn.addEventListener("contextmenu", (event) =>
          event.preventDefault(),
        );
        startBtn.addEventListener("click", newGame);
        chassisGrid.addEventListener("click", (event) => {
          const button = event.target.closest("[data-chassis]");
          if (!button) return;
          selectedChassis = button.dataset.chassis;
          saveGarage();
          renderGarage();
        });
        cannonGrid.addEventListener("click", (event) => {
          const button = event.target.closest("[data-cannon]");
          if (!button) return;
          selectedCannon = button.dataset.cannon;
          saveGarage();
          renderGarage();
        });
        armoryGrid.addEventListener("click", (event) => {
          const button = event.target.closest("[data-armory]");
          if (button) buyArmory(button.dataset.armory);
        });
        exportSaveBtn.addEventListener("click", async () => {
          const code = encodeGarageSave();
          try {
            await navigator.clipboard.writeText(code);
          } catch (error) {}
          prompt("霓虹装甲存档码（已尝试复制，可在其他设备导入）", code);
        });
        importSaveBtn.addEventListener("click", () => {
          const code = prompt("粘贴霓虹装甲存档码：");
          if (!code) return;
          try {
            decodeGarageSave(code);
            alert("存档导入成功，车库与纪录已恢复。");
          } catch (error) {
            alert(`导入失败：${error.message}`);
          }
        });

        function togglePause() {
          if (game.state !== "playing" && game.state !== "paused") return;
          game.state = game.state === "paused" ? "playing" : "paused";
          pauseBtn.textContent = game.state === "paused" ? "▶" : "Ⅱ";
          showToast(game.state === "paused" ? "已暂停" : "继续战斗");
        }

        resize();
        game = { stage: 1 };
        player = makePlayer();
        generateStage();
        camera.x = player.x;
        camera.y = player.y;
        updateCamera(1);
        bestValue.textContent = garageSave.best || 0;
        stageGrid.innerHTML = STAGES.map(
          (stage, index) =>
            `<div class="mode-card stage-card" style="--accent: ${stage.accent}"><strong>第 ${index + 1} 关 · ${stage.name}</strong><span>关底首领：${stage.boss.name}</span></div>`,
        ).join("");
        renderGarage();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
